<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيئة التحضير والوساطة - محكمة القاهرة الاقتصادية</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #c5a059 0%, #dfba73 50%, #9e7d3b 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        
        img.protected-logo { user-drag: none; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; pointer-events: none; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-900" oncontextmenu="return false;">

    <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center bg-slate-950 z-50">
        <i class="fa-solid fa-scale-balanced text-amber-500 text-6xl mb-4 animate-bounce"></i>
        <h2 class="text-xl font-bold text-slate-200">جاري الاتصال بقاعدة بيانات المحكمة...</h2>
    </div>

    <div id="app" class="hidden flex-grow flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQW6GgoM1DWENB70MDxPhTMbansoZ3V4s",
            authDomain: "eecourts-mediation.firebaseapp.com",
            databaseURL: "https://eecourts-mediation-default-rtdb.firebaseio.com",
            projectId: "eecourts-mediation",
            storageBucket: "eecourts-mediation.firebasestorage.app",
            messagingSenderId: "506181080532",
            appId: "1:506181080532:web:0acbae1ab09a245d63b241"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const dbRef = ref(database, 'ECON_COURT_DB'); 

        window.activeTab = 'cases';
        window.currentUser = null;
        window.activeWhatsappContext = null;
        window.activeRepTarget = { type: null, index: null };
        window.pendingExcelFile = null;
        window.claimantCount = 1;
        window.defendantCount = 1;
        
        window.clientIP = 'جاري التحقق...';
        fetch('https://api64.ipify.org?format=json')
            .then(r => r.json())
            .then(d => window.clientIP = d.ip)
            .catch(() => {
                fetch('https://cloudflare.com/cdn-cgi/trace')
                    .then(res => res.text())
                    .then(data => { const match = data.match(/ip=([\d\.]+)/); if(match && match[1]) window.clientIP = match[1]; })
                    .catch(() => window.clientIP = 'غير متوفر');
            });
        
        const SECRET_KEY = "EECourts_Mediation_Secure_Key_2026";
        window.encrypt = function(text) { return text ? CryptoJS.AES.encrypt(text.toString(), SECRET_KEY).toString() : ''; }
        window.decrypt = function(cipher) { 
            if(!cipher) return ''; 
            try { const bytes = CryptoJS.AES.decrypt(cipher, SECRET_KEY); const dec = bytes.toString(CryptoJS.enc.Utf8); return dec || cipher; } 
            catch(e) { return cipher; }
        }

        window.hashPassword = async function(msg) {
            const msgBuffer = new TextEncoder().encode(msg);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const defaultDB = {
            users: [{ id: 'usr_admin', username: 'admin', password: 'Admin123', fullName: 'مدير النظام', role: 'مدير نظام', email: 'admin@eecourts.gov.eg', phone: '01000000000', points: 0, createdAt: new Date().toISOString() }],
            cases: [], deletedCases: [], representatives: [], schedules: [], activities: [],
            msg1DefendantTemplate: `السيد/ [اسم المدعى عليه] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعي] في الدعوى (رقم [رقم الدعوى] اقتصادي القاهرة)، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\n\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg1ClaimantTemplate: `السيد/ [اسم المدعي] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعى عليه] في الدعوى (رقم [رقم الدعوى] اقتصادي القاهرة)، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\n\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg2Template: `هيئة التحضير والوساطة بالمحاكم الاقتصادية\n*طريقك لحل نزاعك وديًا*\n\nالرجاء الاطلاع على المزايا والإجراءات للوصول لأفضل تسوية تحفظ حقوقك.`
        };

        window.db = null; let isDBLoaded = false;
        let incompleteExcelCases = [];

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) window.db = data; else { window.db = defaultDB; set(dbRef, window.db); }

            if(!window.db.schedules || !Array.isArray(window.db.schedules)) window.db.schedules = [];

            if(!isDBLoaded) {
                isDBLoaded = true;
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                window.renderMainLayout();
            } else {
                if(window.currentUser && window.activeTab) {
                    const foundUser = window.db.users.find(u => u.id === window.currentUser.id);
                    if(foundUser) { window.currentUser = foundUser; window.updateUserPointsDisplay(); }
                    if(window.activeTab !== 'caseDetails' && window.activeTab !== 'excelStaging') window.switchTab(window.activeTab); 
                }
            }
        });

        window.saveDB = function() { set(dbRef, window.db); };
        window.getDeviceId = function() { let id = localStorage.getItem('WA_SYS_DEV_ID'); if(!id) { id = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase(); localStorage.setItem('WA_SYS_DEV_ID', id); } return id; }
        window.formatDateDDMMYYYY = function(dateString) { if (!dateString) return ''; const parts = dateString.split('-'); if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`; return dateString; }
        window.updateSystemClock = function() { const clk = document.getElementById('systemClock'); if(clk) clk.innerText = new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date()); };
        setInterval(window.updateSystemClock, 1000);
        window.getCairoDateTimeString = function() { return new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date()); }
        window.formatArabicTime = function(timeString) { if (!timeString) return ''; const [hours, minutes] = timeString.split(':'); let h = parseInt(hours, 10); const ampm = h >= 12 ? 'مساءً' : 'صباحاً'; h = h % 12 || 12; return `${h}:${minutes} ${ampm}`; }
        window.getDayNameFromDate = function(dateString) { if (!dateString) return ''; return new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(new Date(dateString)); }
        window.generateVerificationCode = function() { return 'WAC-' + Date.now().toString().slice(-4) + '-' + Math.random().toString(36).substring(2, 5).toUpperCase(); }

        window.isPastDate = function(dateString) {
            if(!dateString) return false;
            const selected = new Date(dateString); selected.setHours(0,0,0,0);
            const today = new Date(); today.setHours(0,0,0,0);
            return selected < today;
        }

        window.logSystemActivity = function(type, details, userFull = 'مجهول', role = 'غير مصرح') {
            if(!window.db.activities) window.db.activities = [];
            window.db.activities.unshift({ id: 'act_' + Date.now(), timestamp: new Date().toISOString(), cairoTime: window.getCairoDateTimeString(), userId: 'SYSTEM', username: 'system', userFullName: userFull, userRole: role, type: type, details: details, deviceId: window.getDeviceId(), ip: window.clientIP, isHidden: false });
            window.saveDB();
        }

        window.logActivity = function(type, details) {
            if (!window.currentUser) return;
            if(!window.db.activities) window.db.activities = [];
            window.db.activities.unshift({ id: 'act_' + Date.now(), timestamp: new Date().toISOString(), cairoTime: window.getCairoDateTimeString(), userId: window.currentUser.id, username: window.currentUser.username, userFullName: window.currentUser.fullName, userRole: window.currentUser.role, type: type, details: details, deviceId: window.getDeviceId(), ip: window.clientIP, isHidden: false, hiddenByFullName: null });
            window.saveDB();
        }

        window.addPoints = function(points) {
            if (!window.currentUser || window.currentUser.role === 'مدير نظام') return; 
            const u = window.db.users.find(x => x.id === window.currentUser.id);
            if (u) { u.points = (u.points || 0) + points; window.currentUser.points = u.points; window.saveDB(); window.updateUserPointsDisplay(); }
        }

        window.updateUserPointsDisplay = function() {
            const ptsElem = document.getElementById('userPointsBadge');
            if (ptsElem && window.currentUser) {
                ptsElem.innerText = window.currentUser.role === 'مدير نظام' ? `مدير نظام` : `🏅 النقاط: ${window.currentUser.points || 0}`;
            }
        }
        
        window.togglePass = function(id) { const el = document.getElementById(id); el.type = el.type === 'password' ? 'text' : 'password'; }

        window.autoSaveEntity = function(name, phone, creatorName = 'تلقائي') {
            if(!name || !phone) return;
            if(name.match(/(شركة|بنك|مؤسسة|جمعية|هيئة)/i)) {
                if(!window.db.representatives) window.db.representatives = [];
                const exists = window.db.representatives.find(r => r.phone === phone);
                if(!exists) { window.db.representatives.push({ id: Date.now() + Math.random(), entity: name, name: 'ممثل قانوني', phone: phone, creator: creatorName }); }
            }
        }

        // Export data to Excel/Word supporting multiple claimants
        window.exportData = function(type) {
            if(type === 'excel') {
                let csv = '\ufeffرقم الدعوى,المدعين,أرقام هواتف المدعين,المدعى عليهم,أرقام هواتف المدعى عليهم,أمين السر,تاريخ الجلسة,وقت الجلسة,مدخل البيانات\n';
                (window.db.cases || []).forEach(c => {
                    let claimantsList = c.claimants ? c.claimants.map(cl => ({name: window.decrypt(cl.name), phone: window.decrypt(cl.phone)})) : (c.claimant ? [{name: window.decrypt(c.claimant), phone: window.decrypt(c.claimantPhone)}] : []);
                    let clNames = claimantsList.map(cl => cl.name).join(' - ');
                    let clPhones = claimantsList.map(cl => cl.phone).join(' - ');
                    
                    let defsList = c.defendants ? c.defendants.map(d => ({name: window.decrypt(d.name), phone: window.decrypt(d.phone)})) : (c.defendant ? [{name: window.decrypt(c.defendant), phone: window.decrypt(c.defendantPhone)}] : []);
                    let defNames = defsList.map(d => d.name).join(' - ');
                    let defPhones = defsList.map(d => d.phone).join(' - ');

                    csv += `${c.caseNum},${clNames},${clPhones},${defNames},${defPhones},${c.secretaryName},${c.dateStr},${c.timeStr},${c.creator}\n`;
                });
                let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
                let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `سجل_قضايا_الوساطة_${new Date().getTime()}.csv`; a.click();
            } else if(type === 'word') {
                let html = "<html dir='rtl'><head><meta charset='utf-8'></head><body style='font-family:Arial,sans-serif;'><h2 style='text-align:center;'>سجل القضايا المجدولة - إدارة التحضير والوساطة</h2><br><table border='1' cellpadding='5' style='border-collapse:collapse;width:100%;text-align:right;'><tr><th>رقم الدعوى</th><th>المدعين</th><th>المدعى عليهم</th><th>أمين السر</th><th>تاريخ الجلسة</th></tr>";
                (window.db.cases || []).forEach(c => {
                    let claimantsList = c.claimants ? c.claimants.map(cl => ({name: window.decrypt(cl.name), phone: window.decrypt(cl.phone)})) : (c.claimant ? [{name: window.decrypt(c.claimant), phone: window.decrypt(c.claimantPhone)}] : []);
                    let clNames = claimantsList.map(cl => cl.name).join('<br>');
                    
                    let defsList = c.defendants ? c.defendants.map(d => ({name: window.decrypt(d.name), phone: window.decrypt(d.phone)})) : (c.defendant ? [{name: window.decrypt(c.defendant), phone: window.decrypt(c.defendantPhone)}] : []);
                    let defNames = defsList.map(d => d.name).join('<br>');
                    
                    html += `<tr><td>${c.caseNum}</td><td>${clNames}</td><td>${defNames}</td><td>${c.secretaryName}</td><td>${c.dateStr}</td></tr>`;
                });
                html += "</table><br><p style='text-align:center;font-size:12px;'>جميع حقوق الملكية الفكرية محفوظة لهيئة التحضير والوساطة بمحكمة القاهرة الاقتصادية</p></body></html>";
                let blob = new Blob(['\ufeff', html], {type: 'application/msword'});
                let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `تقرير_قضايا_الوساطة_${new Date().getTime()}.doc`; a.click();
            }
            window.logActivity('تصدير بيانات', `تصدير بيانات القضايا بصيغة ${type}`);
        }

        window.renderMainLayout = function() {
            document.getElementById('app').innerHTML = `
                <div id="loginView" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-950">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#c5a059_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="max-w-md w-full bg-slate-900/90 border border-amber-500/30 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative z-10 text-center">
                        <img src="logo.png" alt="شعار المحكمة" class="protected-logo w-24 h-24 mx-auto mb-4 object-contain" oncontextmenu="return false;" draggable="false" onerror="this.style.display='none'">
                        <h1 class="text-2xl font-black text-amber-400 mb-1">جمهورية مصر العربية</h1>
                        <h2 class="text-xl font-bold text-slate-100 mb-1">وزارة العدل</h2>
                        <p class="text-amber-500/90 text-sm font-semibold">محكمة القاهرة الاقتصادية</p>
                        <form onsubmit="handleLogin(event)" class="space-y-5 text-right mt-6">
                            <div><label class="block text-xs font-medium text-slate-300 mb-1.5">اسم المستخدم</label><input type="text" id="loginUsername" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm" dir="ltr"></div>
                            <div class="relative"><label class="block text-xs font-medium text-slate-300 mb-1.5">كلمة المرور</label><input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm"><i class="fa-solid fa-eye absolute left-3 top-9 cursor-pointer text-slate-400 hover:text-white" onclick="togglePass('loginPassword')"></i></div>
                            <div id="loginError" class="hidden text-rose-500 text-xs font-bold text-center bg-rose-500/10 p-2 rounded border border-rose-500/30"></div>
                            <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-lg shadow-lg hover:brightness-110 text-sm">تسجيل الدخول</button>
                        </form>
                    </div>
                </div>

                <div id="appContainer" class="hidden flex-grow flex flex-col">
                    <header class="bg-slate-950 border-b border-amber-500/20 px-6 py-3 no-print sticky top-0 z-50 shadow-lg relative">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">
                            <div class="w-1/3 flex items-center gap-3">
                                <img src="logo.png" alt="شعار المحكمة" class="protected-logo w-10 h-10 object-contain" oncontextmenu="return false;" draggable="false" onerror="this.style.display='none'">
                                <div><h1 class="text-base font-bold text-amber-400 leading-tight">محكمة القاهرة الاقتصادية</h1><p class="text-xs text-slate-400 mb-0.5">هيئة التحضير والوساطة</p></div>
                            </div>
                            <div class="w-1/3 flex justify-center text-center">
                                <div class="bg-slate-900 border border-slate-800 px-5 py-2 rounded-full shadow-inner flex items-center gap-2"><i class="fa-regular fa-clock text-amber-500"></i><span class="text-xs text-emerald-400 font-bold tracking-wide" id="systemClock"></span></div>
                            </div>
                            <div class="w-1/3 flex items-center justify-end gap-3">
                                <button onclick="openLeaderboard()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded shadow flex items-center gap-1 transition-all"><i class="fa-solid fa-ranking-star"></i> <span class="hidden sm:inline">لوحة الشرف</span></button>
                                <div id="userPointsBadge" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-xs px-3 py-1.5 rounded shadow"></div>
                                <div class="text-right hidden md:block"><p class="text-xs font-bold text-slate-200" id="navUserName"></p><span class="inline-block bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded" id="navUserRole"></span></div>
                                <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-amber-600/30 text-slate-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors" title="الملف الشخصي"><i class="fa-solid fa-user-gear"></i></button>
                                <button onclick="logout()" class="bg-slate-800 hover:bg-rose-900/50 text-slate-300 hover:text-rose-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors" title="خروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                            </div>
                        </div>
                    </header>

                    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-2 shadow-md no-print">
                        <div class="max-w-7xl mx-auto flex flex-wrap gap-2 text-xs font-bold">
                            <button id="tab-cases" onclick="switchTab('cases')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-folder-open ml-1"></i> القضايا والرسائل</button>
                            <button id="tab-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-chart-line ml-1"></i> الداش بورد</button>
                            <button id="tab-representatives" onclick="switchTab('representatives')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-building-columns ml-1"></i> الممثلون</button>
                            <button id="tab-schedule" onclick="switchTab('schedule')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-calendar-days ml-1"></i> جدول العمل</button>
                            <button id="tab-activity" onclick="switchTab('activity')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-shield-halved ml-1"></i> سجل النشاط</button>
                            <button id="tab-users" onclick="switchTab('users')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-users-gear ml-1"></i> إدارة النظام</button>
                            <button id="tab-deleted" onclick="switchTab('deleted')" class="tab-btn px-4 py-2 rounded-lg text-rose-400 hidden transition-colors"><i class="fa-solid fa-trash-can ml-1"></i> الأرشيف المحذوف</button>
                        </div>
                    </nav>

                    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
                        <section id="view-cases"></section>
                        <section id="view-caseDetails" class="hidden"></section>
                        <section id="view-excelStaging" class="hidden"></section>
                        <section id="view-dashboard" class="hidden"></section>
                        <section id="view-representatives" class="hidden"></section>
                        <section id="view-schedule" class="hidden"></section>
                        <section id="view-activity" class="hidden"></section>
                        <section id="view-users" class="hidden"></section>
                        <section id="view-deleted" class="hidden"></section>

        window.handleLogin = async function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');
            
            const hashedInput = await window.hashPassword(pass);
            const foundUser = window.db.users.find(u => u.username.toLowerCase() === user.toLowerCase());
            
            if (foundUser && (foundUser.password === hashedInput || foundUser.password === pass)) {
                if (foundUser.password === pass) { foundUser.password = hashedInput; window.saveDB(); }
                window.currentUser = foundUser;
                window.logActivity('تسجيل دخول', 'تسجيل دخول ناجح للنظام');
                
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('navUserName').innerText = window.currentUser.fullName;
                document.getElementById('navUserRole').innerText = window.currentUser.role;
                window.updateUserPointsDisplay();
                window.setupPermissions(); 
                window.switchTab('cases');
            } else {
                window.logSystemActivity('محاولة دخول غير مشروعة', `فشل تسجيل الدخول باسم: ${user}`);
                err.innerText = 'بيانات الدخول غير صحيحة!'; err.classList.remove('hidden');
            }
        }

        window.logout = function() { 
            window.logActivity('تسجيل خروج', 'تسجيل خروج من النظام'); 
            window.currentUser = null; 
            document.getElementById('loginUsername').value = ''; document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.add('hidden'); document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden'); 
        }

        window.setupPermissions = function() {
            const role = window.currentUser.role; const isAdmin = role === 'مدير نظام'; const isManager = role === 'مدير إدارة';
            document.getElementById('tab-dashboard').classList.toggle('hidden', role === 'أمين سر');
            document.getElementById('tab-activity').classList.toggle('hidden', !(isAdmin || isManager));
            document.getElementById('tab-users').classList.toggle('hidden', !isAdmin);
            document.getElementById('tab-deleted').classList.toggle('hidden', !(isAdmin || isManager));
            
            const adminConfig = document.getElementById('adminConfigSection'); if(adminConfig) adminConfig.classList.toggle('hidden', !isAdmin);
            
            const sArea = document.getElementById('scheduleFormArea'); 
            if(sArea) sArea.classList.toggle('hidden', !(isAdmin || isManager));
            
            const sd = document.getElementById('sessionDate'); if(sd) sd.min = new Date().toISOString().split('T')[0];
            window.populateDropdowns();
        }

        window.populateDropdowns = function() {
            const jg = document.getElementById('schJudge'); const sc = document.getElementById('schSec');
            if(jg && sc) {
                jg.innerHTML = window.db.users.filter(u => (u.role === 'قاضي تحضير' || u.role === 'مدير إدارة')).map(u => `<option value="${u.fullName}">${u.fullName}</option>`).join('');
                sc.innerHTML = window.db.users.filter(u => u.role === 'أمين سر').map(u => `<option value="${u.fullName}">${u.fullName}</option>`).join('');
            }
            const cs = document.getElementById('caseSec');
            if(cs) {
                if (window.currentUser && window.currentUser.role === 'أمين سر') {
                    cs.innerHTML = `<option value="${window.currentUser.fullName}">${window.currentUser.fullName}</option>`;
                    cs.disabled = true; cs.classList.add('bg-slate-950', 'text-slate-500', 'cursor-not-allowed', 'border-slate-800'); cs.classList.remove('bg-slate-800', 'text-white', 'border-slate-700');
                } else {
                    cs.innerHTML = window.db.users.filter(u => u.role === 'أمين سر').map(u => `<option value="${u.fullName}">${u.fullName}</option>`).join('');
                    cs.disabled = false; cs.classList.remove('bg-slate-950', 'text-slate-500', 'cursor-not-allowed', 'border-slate-800'); cs.classList.add('bg-slate-800', 'text-white', 'border-slate-700');
                }
            }
            
            const du = document.getElementById('dashUser'); const au = document.getElementById('actUser');
            const usersOpts = `<option value="">الكل (بدون تصفية)</option>` + window.db.users.filter(u => u.username !== 'admin').map(u => `<option value="${u.fullName}">${u.fullName}</option>`).join('');
            if(du) du.innerHTML = usersOpts; if(au) au.innerHTML = usersOpts;
        }

        window.switchTab = function(tabName) {
            window.activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('bg-amber-600', 'text-white'); btn.classList.add('text-slate-300'); });
            const activeBtn = document.getElementById('tab-' + tabName);
            if(activeBtn) {
                if(tabName === 'deleted') activeBtn.classList.add('bg-rose-600', 'text-white');
                else activeBtn.classList.add('bg-amber-600', 'text-white');
                activeBtn.classList.remove('text-slate-300', 'text-rose-400');
            }
            ['cases', 'dashboard', 'representatives', 'schedule', 'activity', 'users', 'deleted', 'caseDetails', 'excelStaging'].forEach(t => { 
                const el = document.getElementById('view-' + t); if(el) el.classList.add('hidden'); 
            });
            const v = document.getElementById('view-' + tabName); if(v) v.classList.remove('hidden');

            if (tabName === 'cases') window.renderCasesTable();
            if (tabName === 'dashboard') window.renderDashboard();
            if (tabName === 'representatives') window.renderRepsTable();
            if (tabName === 'schedule') window.renderScheduleTable();
            if (tabName === 'activity') window.renderActivityTable();
            if (tabName === 'users') window.renderUsersTable();
            if (tabName === 'deleted') window.renderDeletedTable();
        }

        window.handleSaveCase = function(e) {
            e.preventDefault(); 
            const sessionDate = document.getElementById('sessionDate').value;
            
            if(window.isPastDate(sessionDate)) { alert('عفواً، لا يمكن تحديد تاريخ جلسة سابق لتاريخ اليوم!'); return; }

            const caseNum = document.getElementById('caseNum').value + '/' + document.getElementById('caseYear').value;
            const secretaryChoice = window.currentUser.role === 'أمين سر' ? window.currentUser.fullName : document.getElementById('caseSec').value;
            
            // Multiple Claimants extraction
            const claimNames = document.querySelectorAll('.claimant-name');
            const claimPhones = document.querySelectorAll('.claimant-phone');
            let claimantsArr = [];
            for(let i=0; i<claimNames.length; i++) {
                if(claimNames[i].value) {
                    window.autoSaveEntity(claimNames[i].value, claimPhones[i].value, window.currentUser.fullName);
                    claimantsArr.push({ name: window.encrypt(claimNames[i].value), phone: window.encrypt(claimPhones[i].value) });
                }
            }

            // Multiple Defendants extraction
            const defNames = document.querySelectorAll('.def-name');
            const defPhones = document.querySelectorAll('.def-phone');
            let defendantsArr = [];
            for(let i=0; i<defNames.length; i++) {
                if(defNames[i].value) {
                    window.autoSaveEntity(defNames[i].value, defPhones[i].value, window.currentUser.fullName);
                    defendantsArr.push({ name: window.encrypt(defNames[i].value), phone: window.encrypt(defPhones[i].value) });
                }
            }

            if(claimantsArr.length === 0) { alert('يجب إضافة مدعي واحد على الأقل.'); return; }

            const newCase = {
                id: 'case_' + Date.now(), caseNum: caseNum,
                claimants: claimantsArr, 
                defendants: defendantsArr, 
                dateStr: window.formatDateDDMMYYYY(sessionDate), dayStr: window.getDayNameFromDate(sessionDate), timeStr: window.formatArabicTime(document.getElementById('sessionTime').value),
                secretaryName: secretaryChoice, creator: window.currentUser.fullName, createdAt: window.getCairoDateTimeString(), notificationsSent: []
            };
            if(!window.db.cases) window.db.cases = [];
            window.db.cases.unshift(newCase);
            window.saveDB();
            window.addPoints(1); 
            window.logActivity('تسجيل دعوى يدوي', `تسجيل دعوى رقم ${newCase.caseNum}`);
            
            // Reset Form and Counters
            e.target.reset(); 
            window.claimantCount = 1;
            window.defendantCount = 1;
            document.getElementById('claimantsContainer').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-slate-300 mb-1">اسم المدعي <button type="button" onclick="openRepModal('claimant', 0)" class="text-amber-500 hover:text-amber-400 float-left transition-colors"><i class="fa-solid fa-address-book"></i> الدفتر</button></label><input type="text" id="claimantName_0" class="claimant-name w-full bg-slate-800 rounded p-2 text-white" required></div><div><label class="block text-slate-300 mb-1">هاتف المدعي</label><input type="tel" id="claimantPhone_0" class="claimant-phone w-full bg-slate-800 rounded p-2 text-white" required></div></div>`;

        window.triggerExcelUploadModal = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            window.pendingExcelFile = file;

        window.processExcelUpload = function() {
            const unifiedDate = document.getElementById('excelSessionDate').value;
            const unifiedTime = document.getElementById('excelSessionTime').value;
            
            if(!unifiedDate) { alert('يجب تحديد تاريخ الجلسة أولاً!'); return; }
            if(window.isPastDate(unifiedDate)) { alert('لا يمكن تحديد تاريخ جلسة أقدم من تاريخ اليوم!'); return; }
            
            window.closeModal('excelDateModal');
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], {defval: ''});
                    
                    let readyCases = [];
                    incompleteExcelCases = [];

                    if(rows.length === 0) { alert('ملف الإكسيل فارغ.'); document.getElementById('excelUpload').value = ''; return; }

                    const standardFormattedDate = window.formatDateDDMMYYYY(unifiedDate);
                    const standardDayName = window.getDayNameFromDate(unifiedDate);
                    const standardArabicTime = window.formatArabicTime(unifiedTime);

                    rows.forEach((row) => {
                        const cleanRow = {};
                        for(let key in row) {
                            let normKey = key.trim().replace(/\s+/g, ' ').replace(/ى/g, 'ي').replace(/أ|إ|آ/g, 'ا');
                            cleanRow[normKey] = row[key];
                        }

                        const cNum = cleanRow['رقم القضية'] || cleanRow['رقم الدعوي'] || cleanRow['رقم'] || '';
                        const cYear = cleanRow['السنة'] || cleanRow['سنة الدعوي'] || new Date().getFullYear();
                        const cClaimant = cleanRow['اسم المدعي'] || cleanRow['المدعي'] || '';
                        let cClaimantPhone = cleanRow['رقم تليفون المدعي'] || cleanRow['تليفون المدعي'] || cleanRow['هاتف المدعي'] || '';
                        const cDefendant = cleanRow['اسم المدعي عليه'] || cleanRow['المدعي عليه'] || '';
                        let cDefendantPhone = cleanRow['رقم تليفون المدعي عليه'] || cleanRow['تليفون المدعي عليه'] || cleanRow['هاتف المدعي عليه'] || '';

                        if(!cNum || (!cClaimant && !cDefendant)) return; 

                        let formatPhone = (p) => { let s = String(p).trim(); if(s.endsWith('.0')) s = s.slice(0, -2); if(s.length >= 9 && !s.startsWith('0')) s = '0' + s; return s; };
                        
                        cClaimantPhone = formatPhone(cClaimantPhone);
                        cDefendantPhone = formatPhone(cDefendantPhone);

                        let isComplete = cClaimantPhone.length > 5 && cDefendantPhone.length > 5;

                        const caseObj = {
                            tempId: Date.now() + Math.random(), caseNum: cNum + '/' + cYear,
                            claimant: cClaimant, claimantPhone: cClaimantPhone, defendant: cDefendant, defendantPhone: cDefendantPhone,
                            dateStr: standardFormattedDate, dayStr: standardDayName, timeStr: standardArabicTime,
                            secretaryName: window.currentUser.role === 'أمين سر' ? window.currentUser.fullName : (cleanRow['امين السر'] || 'غير محدد'),
                            creator: window.currentUser.fullName
                        };

                        if(isComplete) readyCases.push(caseObj); else incompleteExcelCases.push(caseObj);
                    });

                    if(readyCases.length === 0 && incompleteExcelCases.length === 0) {
                        alert('لم يتم العثور على أي قضايا صالحة في الملف!'); document.getElementById('excelUpload').value = ''; return;
                    }

                    if(!window.db.cases) window.db.cases = [];
                    readyCases.forEach(c => {
                        window.autoSaveEntity(c.claimant, c.claimantPhone, window.currentUser.fullName); 
                        window.autoSaveEntity(c.defendant, c.defendantPhone, window.currentUser.fullName);
                        window.db.cases.unshift({
                            id: 'case_' + c.tempId, caseNum: c.caseNum, 
                            claimants: [{name: window.encrypt(c.claimant), phone: window.encrypt(c.claimantPhone)}],
                            defendants: [{name: window.encrypt(c.defendant), phone: window.encrypt(c.defendantPhone)}],
                            dateStr: c.dateStr, dayStr: c.dayStr, timeStr: c.timeStr, secretaryName: c.secretaryName, creator: c.creator, createdAt: window.getCairoDateTimeString(), notificationsSent: []
                        });
                        window.addPoints(0.5); 
                    });

                    window.saveDB(); 

                    if(readyCases.length > 0) window.logActivity('استيراد إكسيل', `تم استيراد ${readyCases.length} قضية كاملة بجلسة ${standardFormattedDate}`);

                    if(incompleteExcelCases.length > 0) {

        window.prepWA = function(caseId, targetType, targetIndex) {
            const c = window.db.cases.find(x => x.id === caseId);
            let targetName = '', targetPhone = '';
            
            let claimantsList = c.claimants ? c.claimants.map(cl => ({name: window.decrypt(cl.name), phone: window.decrypt(cl.phone)})) : (c.claimant ? [{name: window.decrypt(c.claimant), phone: window.decrypt(c.claimantPhone)}] : []);
            let defsList = c.defendants ? c.defendants.map(d => ({name: window.decrypt(d.name), phone: window.decrypt(d.phone)})) : (c.defendant ? [{name: window.decrypt(c.defendant), phone: window.decrypt(c.defendantPhone)}] : []);
            
            if(targetType === 'claimant') { targetName = claimantsList[targetIndex].name; targetPhone = claimantsList[targetIndex].phone; }
            else { targetName = defsList[targetIndex].name; targetPhone = defsList[targetIndex].phone; }
            
            window.activeWhatsappContext = { caseId, targetType, targetName, targetPhone };
            
            document.getElementById('waTitle').innerHTML = `<i class="fa-brands fa-whatsapp ml-1 text-emerald-400"></i> إرسال إلى: ${targetName} (${c.caseNum})`;
            
            let tmpl = targetType === 'defendant' ? window.db.msg1DefendantTemplate : window.db.msg1ClaimantTemplate;
            
            // Generate combined names for context
            let allClaimantsString = claimantsList.map(cl => cl.name).join(' و ');
            
            let msg1 = tmpl.replace('[اسم المدعى عليه]', targetType === 'defendant' ? targetName : defsList[0].name)
                           .replace('[اسم المدعي]', targetType === 'claimant' ? targetName : allClaimantsString)
                           .replace('[رقم الدعوى]', c.caseNum) 
                           .replace('[اليوم]', c.dayStr)
                           .replace('[التاريخ]', c.dateStr)
                           .replace('[الساعة]', c.timeStr)
                           .replace('[اسم أمين السر]', c.secretaryName || 'غير محدد');
            
            document.getElementById('waMsg1').value = msg1 + "\n\nموقع المحكمة: https://maps.app.goo.gl/Bp8cKHfzuBj5fniy7";
            document.getElementById('waMsg2').value = window.db.msg2Template;
            document.getElementById('waModal').classList.remove('hidden');
        }

        window.executeSendWA = function(msgNum) {
            const c = window.db.cases.find(x => x.id === window.activeWhatsappContext.caseId);
            const ctx = window.activeWhatsappContext;
            let cleanPhone = ctx.targetPhone.replace(/[^0-9]/g, ''); if (cleanPhone.startsWith('01')) cleanPhone = '2' + cleanPhone;
            
            const vCode = window.generateVerificationCode();
            let text = document.getElementById(msgNum === 1 ? 'waMsg1' : 'waMsg2').value;
            text += `\n\n=== توثيق المحكمة ===\nكود التوثيق المرجعي: ${vCode}`;
            
            if(!c.notificationsSent) c.notificationsSent = [];
            c.notificationsSent.push({ type: msgNum === 1 ? 'رسالة أولى' : 'توعوية', targetName: ctx.targetName, targetPhone: window.encrypt(ctx.targetPhone), sender: window.currentUser.fullName, verificationCode: vCode, date: new Date().toISOString() });
            
            window.addPoints(1); window.logActivity('إرسال واتساب', `رسالة (${vCode}) للقضية ${c.caseNum} باسم ${ctx.targetName}`);
            window.saveDB(); window.closeModal('waModal'); 
            if(window.activeTab === 'caseDetails') window.openCaseDetails(c.id);
            else window.renderCasesTable();
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        window.backupDB = function() {
            if(window.currentUser.role !== 'مدير نظام') return;
            const data = JSON.stringify(window.db);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `EE_Courts_Backup_${new Date().getTime()}.json`; a.click();
            window.logActivity('نسخ احتياطي', 'تنزيل نسخة احتياطية من قاعدة البيانات');
        }
        
        window.restoreDB = function(e) {
            if(window.currentUser.role !== 'مدير نظام') return;
            if(!confirm("تحذير خطير: استعادة النسخة الاحتياطية ستمسح كافة البيانات الحالية. هل أنت متأكد؟")) return;
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if(importedData && importedData.users) {
                        window.db = importedData; window.saveDB();
                        window.logSystemActivity('استعادة بيانات', 'استعادة قاعدة البيانات بواسطة المدير', window.currentUser.fullName, window.currentUser.role);
                        alert("تمت استعادة البيانات بنجاح. سيتم إعادة تحميل النظام.");
                        setTimeout(() => location.reload(), 1000);
                    } else { alert("ملف غير صالح."); }
                } catch(err) { alert("حدث خطأ أثناء قراءة الملف."); }
            };
            reader.readAsText(file);
        }

        let dashChart1 = null;
        let dashChart2 = null;
        window.renderDashboard = function() {
            const fDate = document.getElementById('dashFrom').value; 
            const tDate = document.getElementById('dashTo').value; 
            const usr = document.getElementById('dashUser').value;
            
            let cFilter = window.db.cases || [];
            if(fDate) cFilter = cFilter.filter(c => { const parts = c.dateStr.split('/'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`) >= new Date(fDate); });
            if(tDate) cFilter = cFilter.filter(c => { const parts = c.dateStr.split('/'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`) <= new Date(tDate + 'T23:59:59'); });
            if(usr) cFilter = cFilter.filter(c => c.creator === usr);

            document.getElementById('dashTotalCases').innerText = cFilter.length;
            let tMsg = 0; 
            cFilter.forEach(c => { 
                if(c.notificationsSent) {
                    tMsg += usr ? c.notificationsSent.filter(n => n.sender === usr).length : c.notificationsSent.length; 
                }
            });
            document.getElementById('dashTotalMsgs').innerText = tMsg;
            const mC = cFilter.filter(c => (c.dateStr || '').includes(String(new Date().getMonth()+1).padStart(2,'0')+'/'+new Date().getFullYear())).length;
            document.getElementById('dashMonthCases').innerText = mC;
            document.getElementById('dashTeamPts').innerText = window.db.users.filter(u => u.username !== 'admin').reduce((a,b) => a+(b.points||0), 0);

            if(dashChart1) dashChart1.destroy(); 
            if(dashChart2) dashChart2.destroy();
            
            dashChart1 = new Chart(document.getElementById('chart1').getContext('2d'), { 
                type:'bar', 
                data: { labels:['إجمالي القضايا','رسائل الإخطارات'], datasets:[{label:'العدد', data:[cFilter.length, tMsg], backgroundColor:['#d4af37','#10b981'], borderRadius: 4}] }, 
                options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#cbd5e1', font:{family:'Tajawal'}}}}, scales:{y:{ticks:{color:'#94a3b8'}, grid:{color:'#334155'}},x:{ticks:{color:'#cbd5e1', font:{family:'Tajawal'}}, grid:{display:false}}}} 
            });
            
            const realUsers = window.db.users.filter(u => u.username !== 'admin');
            dashChart2 = new Chart(document.getElementById('chart2').getContext('2d'), { 
                type:'doughnut', 
                data: { labels:realUsers.map(u => u.fullName), datasets:[{data:realUsers.map(u => u.points||0), backgroundColor:['#d4af37','#0ea5e9','#10b981','#f43f5e', '#a855f7', '#f97316'], borderWidth: 0}] }, 
                options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{color:'#cbd5e1', font:{family:'Tajawal'}}}}} 
            });
        }

        window.handleSaveSchedule = function(e) { 
            e.preventDefault(); 
            if(!window.db.schedules) window.db.schedules = []; 
            window.db.schedules.push({ id: Date.now(), day: document.getElementById('schDay').value, judge: document.getElementById('schJudge').value, sec: document.getElementById('schSec').value }); 
            window.saveDB(); 
            window.logActivity('تحديث جدول', `تم إضافة مهمة للجدول في يوم ${document.getElementById('schDay').value}`);
            window.renderScheduleTable(); 
        }

        window.renderScheduleTable = function() {
            let mySch = window.db.schedules || [];
            if (window.currentUser.role !== 'مدير إدارة' && window.currentUser.role !== 'مدير نظام') {
                mySch = mySch.filter(s => s.judge === window.currentUser.fullName || s.sec === window.currentUser.fullName);
            }
            const tb = document.getElementById('schTbody');
            if(mySch.length === 0) { tb.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">لا يوجد جداول معتمدة لك</td></tr>'; return; }
            
            tb.innerHTML = mySch.map(s => `
                <tr class="hover:bg-slate-800/60">
                    <td class="p-3 font-bold text-amber-400">${s.day}</td>
                    <td class="p-3">${s.judge}</td>
                    <td class="p-3">${s.sec}</td>
                    <td class="p-3 text-center">
                        ${(window.currentUser.role === 'مدير إدارة' || window.currentUser.role === 'مدير نظام') ? `<button onclick="deleteSch(${s.id})" class="bg-rose-900/50 hover:bg-rose-700 text-rose-300 hover:text-white border border-rose-800 text-[10px] px-2 py-1.5 rounded transition-colors shadow"><i class="fa-solid fa-trash-can"></i> حذف</button>` : '<i class="fa-solid fa-lock text-slate-600"></i>'}
                    </td>
                </tr>`).join('');
        }
        window.deleteSch = function(id) { if(confirm("هل أنت متأكد من الحذف من الجدول؟")) { window.db.schedules = window.db.schedules.filter(x=>x.id!==id); window.saveDB(); window.renderScheduleTable(); } }

        window.renderActivityTable = function() {
            const fDate = document.getElementById('actFrom').value; const tDate = document.getElementById('actTo').value; const usr = document.getElementById('actUser').value;
            let aFilter = window.db.activities || [];
            
            if(fDate) aFilter = aFilter.filter(a => new Date(a.timestamp) >= new Date(fDate));
            if(tDate) aFilter = aFilter.filter(a => new Date(a.timestamp) <= new Date(tDate + 'T23:59:59'));
            if(usr) aFilter = aFilter.filter(a => a.userFullName === usr);
            
            const tb = document.getElementById('activityTbody'); 
            if(aFilter.length === 0) { tb.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500">لا يوجد أنشطة مطابقة للبحث</td></tr>'; return; }
            
            tb.innerHTML = aFilter.slice(0, 100).map(a => `
                <tr class="hover:bg-slate-800/60 ${a.isHidden ? 'opacity-50' : ''}">
                    <td class="p-3 font-mono text-[10px] text-slate-400">${a.cairoTime}</td>
                    <td class="p-3 text-amber-400">${a.userFullName}</td>
                    <td class="p-3">${a.isHidden ? `<span class="text-rose-400 line-through">${a.type}: ${a.details}</span><br><span class="text-[9px] text-slate-500">تم الإخفاء بواسطة: ${a.hiddenByFullName}</span>` : `${a.type}: ${a.details}`}</td>
                    <td class="p-3 text-center font-mono text-emerald-400 text-xs">${a.ip || 'غير متوفر'}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleActivityVisibility('${a.id}')" class="${a.isHidden ? 'text-emerald-400' : 'text-slate-500'} hover:text-white transition"><i class="fa-solid ${a.isHidden ? 'fa-eye' : 'fa-eye-slash'}"></i></button>
                    </td>
                </tr>`).join('');
        }

        window.toggleActivityVisibility = function(id) {
            const a = window.db.activities.find(x => x.id === id);
            if(a) { a.isHidden = !a.isHidden; a.hiddenByFullName = a.isHidden ? window.currentUser.fullName : null; window.saveDB(); window.renderActivityTable(); }
        }

        window.renderDeletedTable = function() {
            const tb = document.getElementById('deletedTbody');
            const cases = window.db.deletedCases || [];
            const canDeleteForever = window.currentUser.role === 'مدير نظام' || window.currentUser.role === 'مدير إدارة';
            
            if(cases.length === 0) { tb.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500">الأرشيف فارغ</td></tr>'; return; }
            tb.innerHTML = cases.map(c => {
                let claimantsList = c.claimants ? c.claimants.map(cl => ({name: window.decrypt(cl.name), phone: window.decrypt(cl.phone)})) : (c.claimant ? [{name: window.decrypt(c.claimant), phone: window.decrypt(c.claimantPhone)}] : []);
                let defsList = c.defendants ? c.defendants.map(d => ({name: window.decrypt(d.name), phone: window.decrypt(d.phone)})) : (c.defendant ? [{name: window.decrypt(c.defendant), phone: window.decrypt(c.defendantPhone)}] : []);
                
                return `
                <tr class="hover:bg-slate-800/60">
                    <td class="p-3 font-bold text-amber-400 font-mono">${c.caseNum}</td>
                    <td class="p-3">${claimantsList.length > 0 ? claimantsList[0].name : 'غير متوفر'} / ${defsList.length > 0 ? defsList[0].name : 'غير متوفر'}</td>
                    <td class="p-3 font-mono text-slate-400">${c.dateStr}</td>
                    <td class="p-3 text-xs text-rose-400">حُذفت بواسطة: <b>${c.deletedBy}</b><br><span class="text-[9px] text-slate-500">${c.deletedAt}</span></td>
                    <td class="p-3 text-center">
                        ${canDeleteForever ? `<button onclick="permanentDeleteCase('${c.id}')" class="bg-rose-700 hover:bg-rose-600 text-white px-2 py-1 rounded text-xs shadow"><i class="fa-solid fa-trash-can"></i> حذف نهائي</button>` : '-'}
                    </td>
                </tr>`;
            }).join('');
        }

        window.permanentDeleteCase = function(id) {
            if(!confirm('تنبيه خطير! هل أنت متأكد من مسح هذه القضية نهائياً من قاعدة البيانات بلا رجعة؟')) return;
            const cIdx = window.db.deletedCases.findIndex(x => x.id === id);
            if(cIdx > -1) {
                const c = window.db.deletedCases[cIdx];
                window.logSystemActivity('مسح نهائي', `تم مسح القضية ${c.caseNum} من الأرشيف نهائياً`, window.currentUser.fullName, window.currentUser.role);
                window.db.deletedCases.splice(cIdx, 1);
                window.saveDB(); window.renderDeletedTable();
            }
        }

        window.renderUsersTable = function() {
            const canDelete = window.currentUser.role === 'مدير نظام';
            document.getElementById('usersTbody').innerHTML = window.db.users.map(u => `
                <tr class="hover:bg-slate-800/60">
                    <td class="p-3 font-mono font-bold">${u.username}</td>
                    <td class="p-3">${u.fullName}</td>
                    <td class="p-3 text-amber-400 font-bold">${u.role}</td>
                    <td class="p-3 font-mono text-emerald-400 font-bold">🏅 ${u.points||0}</td>
                    <td class="p-3 text-center flex justify-center gap-2">
                        <button onclick="openUserModal('${u.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-xs shadow"><i class="fa-solid fa-pen"></i></button>
                        ${canDelete ? `<button onclick="deleteUser('${u.id}')" class="bg-rose-700 hover:bg-rose-600 text-white px-2 py-1 rounded text-xs shadow"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </td>
                </tr>`).join('');
            document.getElementById('adminMsg2').value = window.db.msg2Template;
        }

        window.deleteUser = function(id) {
            if(id === 'usr_admin') { alert('لا يمكن حذف الحساب الأساسي للمدير!'); return; }
            if(!confirm('هل أنت متأكد من حذف هذا الحساب نهائياً؟')) return;
            const u = window.db.users.find(x => x.id === id);
            window.db.users = window.db.users.filter(x => x.id !== id);
            window.logSystemActivity('حذف حساب', `حذف حساب المستخدم: ${u.fullName}`, window.currentUser.fullName, window.currentUser.role);
            window.saveDB(); window.renderUsersTable();
        }

        window.saveAdminMsg2 = function() { window.db.msg2Template = document.getElementById('adminMsg2').value; window.saveDB(); alert('تم حفظ القالب بنجاح.'); }
        
        window.openUserModal = function(id=null) {
            document.getElementById('uId').value = id || ''; 
            document.getElementById('uUser').value = id ? window.db.users.find(x=>x.id===id).username : ''; 
            document.getElementById('uUser').disabled = !!id;
            document.getElementById('userModalTitle').innerText = id ? 'تعديل بيانات الحساب' : 'إضافة حساب جديد';
            
            if(id) { 
                const u = window.db.users.find(x=>x.id===id); 
                document.getElementById('uName').value = u.fullName; 
                document.getElementById('uRole').value = u.role; 
                document.getElementById('uEmail').value = u.email ? u.email.replace('@eecourts.gov.eg', '') : '';
            } else { 
                document.getElementById('uName').value = ''; 
                document.getElementById('uEmail').value = '';
            }
            document.getElementById('userModal').classList.remove('hidden');
        }
        
        window.saveUser = async function(e) {
            e.preventDefault(); const id = document.getElementById('uId').value;
            let pass = document.getElementById('uPass').value; if(pass) pass = await window.hashPassword(pass);
            const emailInput = document.getElementById('uEmail').value ? document.getElementById('uEmail').value + '@eecourts.gov.eg' : '';
            
            if(id) { 
                const u = window.db.users.find(x=>x.id===id); 
                u.fullName = document.getElementById('uName').value; 
                u.role = document.getElementById('uRole').value; 
                u.email = emailInput;
                if(pass) u.password = pass; 
            } 
            else { 
                window.db.users.push({id:'usr_'+Date.now(), username:document.getElementById('uUser').value, fullName:document.getElementById('uName').value, email:emailInput, password:pass, role:document.getElementById('uRole').value, points:0, createdAt: new Date().toISOString()}); 
            }
            window.saveDB(); window.closeModal('userModal'); window.renderUsersTable(); window.populateDropdowns();
        }

        window.renderRepsTable = function() {
            const tb = document.getElementById('repsTbody'); const reps = window.db.representatives || [];
            const isAdminOrManager = window.currentUser.role === 'مدير نظام' || window.currentUser.role === 'مدير إدارة';
            
            if(reps.length === 0) tb.innerHTML = '<tr><td colspan="5" class="p-4 text-center">الدفتر فارغ</td></tr>';
            else tb.innerHTML = reps.map(r => `
                <tr class="hover:bg-slate-800/60">
                    <td class="p-3 font-bold">${r.entity}</td>
                    <td class="p-3 text-slate-300 text-[11px]">${r.name || 'ممثل قانوني'}</td>
                    <td class="p-3 font-mono text-emerald-400">${r.phone}</td>
                    <td class="p-3 text-center text-[10px] text-slate-400">${r.creator || 'مجهول'}</td>
                    <td class="p-3 text-center flex justify-center gap-2">
                        ${isAdminOrManager ? `<button onclick="openEditRepModal('${r.id}')" class="text-blue-400 hover:text-blue-300 transition"><i class="fa-solid fa-pen"></i></button>` : ''}
                        ${isAdminOrManager ? `<button onclick="deleteRep('${r.id}')" class="text-rose-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>` : '-'}
                    </td>
                </tr>`).join(''); 
        }

        window.openEditRepModal = function(id) {
            const r = window.db.representatives.find(x => x.id == id); if(!r) return;
            document.getElementById('editRepId').value = id;
            document.getElementById('editRepEntity').value = r.entity;
            document.getElementById('editRepName').value = r.name || 'ممثل قانوني';
            document.getElementById('editRepPhone').value = r.phone;
            document.getElementById('editRepModal').classList.remove('hidden');
        }

        window.saveEditedRep = function(e) {
            e.preventDefault();
            const id = document.getElementById('editRepId').value;
            const r = window.db.representatives.find(x => x.id == id);
            if(r) { 
                r.entity = document.getElementById('editRepEntity').value; 
                r.name = document.getElementById('editRepName').value;
                r.phone = document.getElementById('editRepPhone').value; 
                window.saveDB(); window.closeModal('editRepModal'); window.renderRepsTable(); 
            }
        }

        window.deleteRep = function(id) {
            if(!confirm('هل أنت متأكد من حذف جهة الاتصال من الدفتر؟')) return;
            window.db.representatives = window.db.representatives.filter(r => r.id != id);
            window.saveDB(); window.renderRepsTable();
        }

        window.openRepModal = function(type, index) { 
            window.activeRepTarget = { type, index }; 
            document.getElementById('repModal').classList.remove('hidden'); 
            window.filterRepSearch(); 
        }
        
        window.filterRepSearch = function() { 
            const term = document.getElementById('repSearch').value.toLowerCase(); 
            const reps = window.db.representatives || [];
            
            const filtered = reps.filter(r => r.entity.includes(term) || (r.name && r.name.includes(term)));
            const list = document.getElementById('repList');
            
            if(filtered.length === 0) { list.innerHTML = '<p class="text-slate-500 text-xs text-center py-2">لا يوجد ممثلين...</p>'; return; }
            
            list.innerHTML = filtered.map(r => `
                <div onclick="selectRep('${r.entity}', '${r.phone}')" class="bg-slate-800 p-3 rounded cursor-pointer hover:bg-slate-700 mb-2 border border-slate-700 hover:border-amber-500 transition-all">
                    <p class="text-amber-400 font-bold text-xs">${r.entity}</p>
                    <p class="text-slate-300 text-[11px] mt-1"><i class="fa-solid fa-user-tie ml-1"></i>${r.name || 'ممثل قانوني'} <span class="mx-2 text-slate-500">|</span> <span class="font-mono text-emerald-400 font-bold">${r.phone}</span></p>
                </div>
            `).join(''); 
        }

        window.selectRep = function(name, phone) { 
            const type = window.activeRepTarget.type; 
            const idx = window.activeRepTarget.index;
            document.getElementById(`${type}Name_${idx}`).value = name;
            document.getElementById(`${type}Phone_${idx}`).value = phone;
            window.closeModal('repModal'); 
        }
    </script>
</body>
</html>
