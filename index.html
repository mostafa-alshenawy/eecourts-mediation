<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيئة التحضير والوساطة - محكمة القاهرة الاقتصادية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #c5a059 0%, #dfba73 50%, #9e7d3b 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-900">

    <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center bg-slate-950 z-50">
        <i class="fa-solid fa-scale-balanced text-amber-500 text-6xl mb-4 animate-bounce"></i>
        <h2 class="text-xl font-bold text-slate-200">جاري الاتصال بقاعدة بيانات المحكمة...</h2>
    </div>

    <div id="app" class="hidden flex-grow flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQW6GgoM1DWENB70MDxPhTMbansoZ3V4s",
            authDomain: "eecourts-mediation.firebaseapp.com",
            databaseURL: "https://eecourts-mediation-default-rtdb.firebaseio.com",
            projectId: "eecourts-mediation",
            storageBucket: "eecourts-mediation.firebasestorage.app",
            messagingSenderId: "506181080532",
            appId: "1:506181080532:web:0acbae1ab09a245d63b241"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const dbRef = ref(database, 'ECON_COURT_DB'); 

        window.activeTab = 'cases';
        window.currentUser = null;
        window.activeWhatsappContext = null;
        window.activeRepTargetField = null;

        const defaultDB = {
            users: [
                { id: 'usr_admin', username: 'admin', password: 'Admin123', fullName: 'مدير النظام', role: 'مدير نظام', gender: 'ذكر', nationalId: '29001010100000', birthDate: '1990-01-01', email: 'admin@eecourts.gov.eg', phone: '01000000000', points: 0, createdAt: new Date().toISOString() }
            ],
            cases: [], representatives: [], schedules: [], activities: [], failedAttempts: {},
            msg1DefendantTemplate: `السيد/ [اسم المدعى عليه] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعي]، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg1ClaimantTemplate: `السيد/ [اسم المدعي] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعى عليه]، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg2Template: `هيئة التحضير والوساطة بالمحاكم الاقتصادية\n*طريقك لحل نزاعك وديًا*\n\nالرجاء الاطلاع على المزايا والإجراءات للوصول لأفضل تسوية تحفظ حقوقك.`
        };

        window.db = null;
        let isDBLoaded = false;

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.db = data;
            } else {
                window.db = defaultDB;
                set(dbRef, window.db);
            }

            if(!isDBLoaded) {
                isDBLoaded = true;
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                window.renderMainLayout();
            } else {
                if(window.currentUser && window.activeTab) {
                    const foundUser = window.db.users.find(u => u.id === window.currentUser.id);
                    if(foundUser) {
                        window.currentUser = foundUser;
                        window.updateUserPointsDisplay();
                    }
                    window.switchTab(window.activeTab); 
                }
            }
        });

        window.saveDB = function() {
            set(dbRef, window.db);
        };

        window.getDeviceId = function() {
            let id = localStorage.getItem('WA_SYS_DEV_ID');
            if(!id) { id = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase(); localStorage.setItem('WA_SYS_DEV_ID', id); }
            return id;
        }

        window.formatDateDDMMYYYY = function(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-'); 
            if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateString;
        }

        window.getCairoDateTimeString = function() { return new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date()); }

        window.formatArabicTime = function(timeString) {
            if (!timeString) return '';
            const [hours, minutes] = timeString.split(':');
            let h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'مساءً' : 'صباحاً';
            h = h % 12 || 12;
            return `${h}:${minutes} ${ampm}`;
        }

        window.getDayNameFromDate = function(dateString) { if (!dateString) return ''; return new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(new Date(dateString)); }
        window.generateVerificationCode = function() { return 'WAC-' + Date.now().toString().slice(-4) + '-' + Math.random().toString(36).substring(2, 5).toUpperCase(); }

        window.logSystemActivity = function(type, details, userFull = 'مجهول', role = 'غير مصرح') {
            if(!window.db.activities) window.db.activities = [];
            window.db.activities.unshift({ id: 'act_' + Date.now(), timestamp: new Date().toISOString(), cairoTime: window.getCairoDateTimeString(), userId: 'SYSTEM', username: 'system', userFullName: userFull, userRole: role, type: type, details: details, deviceId: window.getDeviceId(), isHidden: false });
            window.saveDB();
        }

        window.logActivity = function(type, details) {
            if (!window.currentUser) return;
            if(!window.db.activities) window.db.activities = [];
            window.db.activities.unshift({ id: 'act_' + Date.now(), timestamp: new Date().toISOString(), cairoTime: window.getCairoDateTimeString(), userId: window.currentUser.id, username: window.currentUser.username, userFullName: window.currentUser.fullName, userRole: window.currentUser.role, type: type, details: details, deviceId: window.getDeviceId(), isHidden: false, hiddenByUsername: null, hiddenByFullName: null });
            window.saveDB();
        }

        window.addPoint = function(reason) {
            const u = window.db.users.find(x => x.id === window.currentUser.id);
            if (u) { u.points = (u.points || 0) + 1; window.currentUser.points = u.points; window.saveDB(); window.updateUserPointsDisplay(); }
        }

        window.updateUserPointsDisplay = function() {
            const ptsElem = document.getElementById('userPointsBadge');
            if (ptsElem && window.currentUser) ptsElem.innerText = `🏅 النقاط: ${window.currentUser.points || 0}`;
        }

        window.renderMainLayout = function() {
            document.getElementById('app').innerHTML = `
                <div id="loginView" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-950">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#c5a059_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="max-w-md w-full bg-slate-900/90 border border-amber-500/30 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative z-10">
                        <div class="text-center mb-8"><h1 class="text-2xl font-black text-amber-400 mb-1">جمهورية مصر العربية</h1><h2 class="text-xl font-bold text-slate-100 mb-1">وزارة العدل</h2><p class="text-amber-500/90 text-sm font-semibold">محكمة القاهرة الاقتصادية</p><p class="text-xs text-slate-400 mt-1">نظام إدارة هيئة التحضير والوساطة</p></div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div><label class="block text-xs font-medium text-slate-300 mb-1.5">اسم المستخدم</label><input type="text" id="loginUsername" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm" dir="ltr"></div>
                            <div><label class="block text-xs font-medium text-slate-300 mb-1.5">كلمة المرور</label><input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm"></div>
                            <div id="loginError" class="hidden text-rose-500 text-xs font-bold text-center bg-rose-500/10 p-2 rounded border border-rose-500/30"></div>
                            <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-lg shadow-lg hover:brightness-110 text-sm">تسجيل الدخول للنظام</button>
                        </form>
                    </div>
                </div>

                <div id="appContainer" class="hidden flex-grow flex flex-col">
                    <header class="bg-slate-950 border-b border-amber-500/20 px-6 py-3 no-print sticky top-0 z-50 shadow-lg">
                        <div class="max-w-7xl mx-auto flex justify-between items-center">
                            <div><h1 class="text-base font-bold text-amber-400 leading-tight">محكمة القاهرة الاقتصادية</h1><p class="text-xs text-slate-400">هيئة التحضير والوساطة وتسوية المنازعات</p></div>
                            <div class="flex items-center gap-4">
                                <button onclick="openLeaderboard()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded shadow flex items-center gap-1 transition-all"><i class="fa-solid fa-ranking-star"></i> لوحة الشرف</button>
                                <div id="userPointsBadge" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-xs px-3 py-1.5 rounded shadow"></div>
                                <div class="text-right hidden sm:block"><p class="text-xs font-bold text-slate-200" id="navUserName"></p><span class="inline-block bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded" id="navUserRole"></span></div>
                                <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-amber-600/30 text-slate-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors" title="الملف الشخصي"><i class="fa-solid fa-user-gear"></i></button>
                                <button onclick="logout()" class="bg-slate-800 hover:bg-rose-900/50 text-slate-300 hover:text-rose-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors"><i class="fa-solid fa-arrow-right-from-bracket ml-1"></i> خروج</button>
                            </div>
                        </div>
                    </header>

                    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-2 shadow-md no-print">
                        <div class="max-w-7xl mx-auto flex flex-wrap gap-2 text-xs font-bold">
                            <button id="tab-cases" onclick="switchTab('cases')" class="tab-btn px-4 py-2 rounded-lg bg-amber-600 text-white transition-colors"><i class="fa-solid fa-folder-open ml-1"></i> القضايا والرسائل</button>
                            <button id="tab-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-chart-line ml-1"></i> الداش بورد</button>
                            <button id="tab-representatives" onclick="switchTab('representatives')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-building-columns ml-1"></i> الممثلون</button>
                            <button id="tab-schedule" onclick="switchTab('schedule')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-calendar-days ml-1"></i> جدول العمل</button>
                            <button id="tab-activity" onclick="switchTab('activity')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-shield-halved ml-1"></i> سجل النشاط</button>
                            <button id="tab-users" onclick="switchTab('users')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-users-gear ml-1"></i> إدارة النظام</button>
                        </div>
                    </nav>

                    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
                        <section id="view-cases"></section>
                        <section id="view-dashboard" class="hidden"></section>
                        <section id="view-representatives" class="hidden"></section>
                        <section id="view-schedule" class="hidden"></section>
                        <section id="view-activity" class="hidden"></section>
                        <section id="view-users" class="hidden"></section>
                    </main>
                </div>
                <div id="modalsContainer"></div>
            `;
            window.buildSectionHTML();
            window.buildModalsHTML();
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');
            
            const foundUser = window.db.users.find(u => u.username.toLowerCase() === user.toLowerCase());
            
            if (foundUser && foundUser.password === pass) {
                window.currentUser = foundUser;
                window.logActivity('تسجيل دخول', 'تسجيل دخول ناجح');
                
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('navUserName').innerText = window.currentUser.fullName;
                document.getElementById('navUserRole').innerText = window.currentUser.role;
                window.updateUserPointsDisplay();
                window.setupPermissions(); 
                window.switchTab('cases');
            } else {
                window.logSystemActivity('محاولة دخول غير مشروعة', `فشل تسجيل الدخول باسم: ${user}`);
                err.innerText = 'بيانات الدخول غير صحيحة!';
                err.classList.remove('hidden');
            }
        }

        window.logout = function() { 
            window.logActivity('تسجيل خروج', 'تسجيل خروج من النظام'); 
            window.currentUser = null; 
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden'); 
        }

        window.setupPermissions = function() {
            const role = window.currentUser.role;
            document.getElementById('tab-dashboard').classList.toggle('hidden', role === 'أمين سر');
            document.getElementById('tab-activity').classList.toggle('hidden', !(role === 'مدير نظام' || role === 'مدير إدارة'));
            document.getElementById('tab-users').classList.toggle('hidden', role !== 'مدير نظام');
            const adminConfig = document.getElementById('adminConfigSection');
            if(adminConfig) adminConfig.classList.toggle('hidden', role !== 'مدير نظام');
            const today = new Date().toISOString().split('T')[0];
            const sd = document.getElementById('sessionDate');
            if(sd) sd.min = today;
            window.populateDropdowns();
        }

        window.switchTab = function(tabName) {
            window.activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('bg-amber-600', 'text-white'); btn.classList.add('text-slate-300'); });
            document.getElementById('tab-' + tabName).classList.add('bg-amber-600', 'text-white');
            document.getElementById('tab-' + tabName).classList.remove('text-slate-300');

            ['cases', 'dashboard', 'representatives', 'schedule', 'activity', 'users'].forEach(t => { document.getElementById('view-' + t).classList.add('hidden'); });
            document.getElementById('view-' + tabName).classList.remove('hidden');

            if (tabName === 'cases') window.renderCasesTable();
            if (tabName === 'dashboard') window.renderDashboard();
            if (tabName === 'representatives') window.renderRepsTable();
            if (tabName === 'schedule') window.renderScheduleTable();
            if (tabName === 'activity') window.renderActivityTable();
            if (tabName === 'users') window.renderUsersTable();
        }

        window.buildSectionHTML = function() {
            document.getElementById('view-cases').innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl mb-6">
                    <h2 class="text-sm font-bold text-amber-400 mb-4 border-b border-slate-800 pb-2"><i class="fa-solid fa-file-circle-plus"></i> تسجيل دعوى جديدة وتحديد الجلسة</h2>
                    <form onsubmit="handleSaveCase(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                        <div><label class="block text-slate-300 mb-1">رقم الدعوى</label><input type="number" id="caseNum" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"></div>
                        <div><label class="block text-slate-300 mb-1">سنة الدعوى</label><input type="number" id="caseYear" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" value="${new Date().getFullYear()}"></div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">تاريخ ووقت الجلسة</label>
                            <div class="flex gap-2">
                                <input type="date" id="sessionDate" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white">
                                <input type="time" id="sessionTime" required value="10:00" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white">
                            </div>
                        </div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">أمين السر المختص</label><select id="caseSec" required class="w-full border border-slate-700 rounded p-2"></select></div>
                        <div class="md:col-span-2"></div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">اسم المدعي <button type="button" onclick="openRepModal('claimant')" class="text-amber-500 hover:text-amber-400 float-left transition-colors"><i class="fa-solid fa-address-book"></i> الدفتر</button></label><input type="text" id="claimantName" required class="w-full bg-slate-800 rounded p-2 text-white"></div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">هاتف المدعي</label><input type="tel" id="claimantPhone" required class="w-full bg-slate-800 rounded p-2 text-white"></div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">اسم المدعى عليه <button type="button" onclick="openRepModal('defendant')" class="text-amber-500 hover:text-amber-400 float-left transition-colors"><i class="fa-solid fa-address-book"></i> الدفتر</button></label><input type="text" id="defendantName" required class="w-full bg-slate-800 rounded p-2 text-white"></div>
                        <div class="md:col-span-2"><label class="block text-slate-300 mb-1">هاتف المدعى عليه</label><input type="tel" id="defendantPhone" required class="w-full bg-slate-800 rounded p-2 text-white"></div>
                        <div class="md:col-span-4 flex justify-end mt-2"><button type="submit" class="gold-gradient text-slate-950 hover:brightness-110 font-bold px-6 py-2 rounded shadow transition-all"><i class="fa-solid fa-plus ml-1"></i> حفظ وتسجيل الدعوى (1 نقطة)</button></div>
                    </form>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-sm font-bold text-slate-200"><i class="fa-solid fa-list-check ml-1"></i> سجل القضايا المجدولة</h3><input type="text" id="searchCases" onkeyup="renderCasesTable()" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white w-64 focus:border-amber-500 outline-none transition-colors" placeholder="بحث برقم الدعوى أو كود التوثيق..."></div>
                    <div class="overflow-x-auto"><table class="w-full text-right text-xs text-slate-300"><thead class="bg-slate-950 text-amber-400"><tr><th class="p-3">الدعوى</th><th class="p-3">المدعي</th><th class="p-3">المدعى عليه</th><th class="p-3">الجلسة وأمين السر</th><th class="p-3">مُدخل البيانات</th><th class="p-3">حالة الإخطارات (أكواد التوثيق)</th><th class="p-3 text-center">الإرسال</th></tr></thead><tbody id="casesTbody" class="divide-y divide-slate-800"></tbody></table></div>
                </div>
            `;
            document.getElementById('view-dashboard').innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex gap-4 text-xs mb-6">
                    <div><label class="block text-slate-400 mb-1">من تاريخ:</label><input type="date" id="dashFrom" onchange="renderDashboard()" class="bg-slate-800 border-slate-700 rounded p-1.5 text-white outline-none"></div>
                    <div><label class="block text-slate-400 mb-1">إلى تاريخ:</label><input type="date" id="dashTo" onchange="renderDashboard()" class="bg-slate-800 border-slate-700 rounded p-1.5 text-white outline-none"></div>
                    <div><label class="block text-slate-400 mb-1">المستخدم:</label><select id="dashUser" onchange="renderDashboard()" class="bg-slate-800 border-slate-700 rounded p-1.5 text-white outline-none"></select></div>

            if(filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-500">لا يوجد قضايا مسجلة مطابقة للبحث</td></tr>'; return; }

            const c = window.db.cases.find(x => x.id === caseId); const isDef = target === 'def';
            document.getElementById('waTitle').innerHTML = `<i class="fa-brands fa-whatsapp ml-1 text-emerald-400"></i> إرسال إلى ${isDef ? 'المدعى عليه' : 'المدعي'} (${c.caseNum})`;
            let msg1 = (isDef ? window.db.msg1DefendantTemplate : window.db.msg1ClaimantTemplate).replace('[اسم المدعى عليه]', c.defendant).replace('[اسم المدعي]', c.claimant).replace('[اليوم]', c.dayStr).replace('[التاريخ]', c.dateStr).replace('[الساعة]', c.timeStr).replace('[اسم أمين السر]', c.secretaryName || 'غير محدد');
            document.getElementById('waMsg1').value = msg1 + "\n\nموقع المحكمة: https://maps.app.goo.gl/Bp8cKHfzuBj5fniy7";
            document.getElementById('waMsg2').value = window.db.msg2Template;
            document.getElementById('waModal').classList.remove('hidden');
        }

        window.executeSendWA = function(msgNum) {
            const c = window.db.cases.find(x => x.id === window.activeWhatsappContext.caseId);
            const phone = window.activeWhatsappContext.target === 'def' ? c.defendantPhone : c.claimantPhone;
            let cleanPhone = phone.replace(/[^0-9]/g, ''); if (cleanPhone.startsWith('01')) cleanPhone = '2' + cleanPhone;
            const vCode = window.generateVerificationCode();
            let text = document.getElementById(msgNum === 1 ? 'waMsg1' : 'waMsg2').value;
            text += `\n\n=== توثيق المحكمة ===\nكود التوثيق المرجعي: ${vCode}`;
            if(!c.notificationsSent) c.notificationsSent = [];
            c.notificationsSent.push({ type: msgNum === 1 ? 'رسالة أولى' : 'توعوية', target: window.activeWhatsappContext.target, sender: window.currentUser.fullName, verificationCode: vCode, date: new Date().toISOString() });
            window.addPoint('إرسال واتساب'); window.logActivity('إرسال واتساب', `توليد كود (${vCode}) لرقم ${cleanPhone}`);
            window.renderCasesTable(); window.closeModal('waModal');
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        window.renderActivityTable = function() {
            const fDate = document.getElementById('actFrom').value; const tDate = document.getElementById('actTo').value; const usr = document.getElementById('actUser').value;
            let aFilter = window.db.activities || [];
            if(fDate) aFilter = aFilter.filter(a => new Date(a.timestamp) >= new Date(fDate));
            if(tDate) aFilter = aFilter.filter(a => new Date(a.timestamp) <= new Date(tDate + 'T23:59:59'));
            if(usr) aFilter = aFilter.filter(a => a.userFullName === usr);
            const tb = document.getElementById('activityTbody');
            if(aFilter.length === 0) { tb.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-500">لا يوجد أنشطة مطابقة للبحث</td></tr>'; return; }
            tb.innerHTML = aFilter.map(a => {
                if(a.isHidden && window.currentUser.role !== 'مدير نظام' && a.hiddenByUsername !== window.currentUser.username) return '';
                let trClass = 'hover:bg-slate-800/60 transition-colors'; if(a.type === 'محاولة دخول غير مشروعة') trClass = 'bg-rose-950/40 border-l-4 border-rose-500'; if(a.isHidden) trClass = 'opacity-50 line-through bg-rose-950/20';
                return `<tr class="${trClass}"><td class="p-3 font-mono text-slate-400 text-[10px]">${a.cairoTime}</td><td class="p-3 font-bold">${a.userFullName} <br><span class="text-amber-500 text-[10px]">${a.userRole}</span></td><td class="p-3 ${a.type === 'محاولة دخول غير مشروعة' ? 'text-rose-400 font-bold' : ''}">${a.type}</td><td class="p-3">${a.details}</td><td class="p-3 font-mono text-[10px] text-slate-500">${a.deviceId}</td><td class="p-3 text-center">${!a.isHidden && (window.currentUser.role === 'مدير إدارة' || window.currentUser.role === 'مدير نظام') ? `<button onclick="toggleAct('${a.id}',true)" class="text-rose-400 hover:text-rose-300 text-[10px] font-bold">إخفاء</button>` : ''} ${a.isHidden ? `<span class="block text-[9px] text-rose-300">أخفاه: ${a.hiddenByFullName}</span>${(window.currentUser.role === 'مدير نظام' || window.currentUser.username === a.hiddenByUsername) ? `<button onclick="toggleAct('${a.id}',false)" class="text-amber-400 hover:text-amber-300 text-[10px] font-bold mt-1">إعادة إظهار</button>` : ''}` : ''}</td></tr>`;
            }).join('');
        }
        window.toggleAct = function(id, hide) { const a = window.db.activities.find(x => x.id === id); a.isHidden = hide; a.hiddenByUsername = hide ? window.currentUser.username : null; a.hiddenByFullName = hide ? window.currentUser.fullName : null; window.saveDB(); window.renderActivityTable(); }

        window.openRepModal = function(target) { window.activeRepTargetField = target; document.getElementById('repSearch').value = ''; window.filterRepSearch(); document.getElementById('repModal').classList.remove('hidden'); }
        window.filterRepSearch = function() { 
            const term = document.getElementById('repSearch').value.toLowerCase(); const reps = window.db.representatives || [];
            const filtered = reps.filter(r => r.entity.includes(term) || r.name.includes(term)); const list = document.getElementById('repList');
            if(filtered.length === 0) list.innerHTML = '<p class="text-slate-500 text-xs text-center py-2">لا يوجد ممثلين...</p>';
            else list.innerHTML = filtered.map(r => `<div onclick="selectRep('${r.name}', '${r.phone}')" class="bg-slate-800 border border-slate-700 p-3 rounded cursor-pointer hover:bg-slate-700 hover:border-amber-500 transition-all"><p class="text-amber-400 font-bold text-xs">${r.entity}</p><p class="text-slate-300 text-xs mt-1"><i class="fa-solid fa-user-tie ml-1"></i>${r.name} <span class="mx-2 text-slate-500">|</span> <span class="font-mono text-emerald-400">${r.phone}</span></p></div>`).join(''); 
        }
        window.selectRep = function(name, phone) { document.getElementById(window.activeRepTargetField + 'Name').value = name; document.getElementById(window.activeRepTargetField + 'Phone').value = phone; window.closeModal('repModal'); }
        window.handleSaveRep = function(e) { e.preventDefault(); if(!window.db.representatives) window.db.representatives = []; window.db.representatives.push({ id: Date.now(), entity: document.getElementById('repEntity').value, name: document.getElementById('repName').value, phone: document.getElementById('repPhone').value }); window.saveDB(); e.target.reset(); window.renderRepsTable(); }
        window.renderRepsTable = function() { 
            const tb = document.getElementById('repsTbody'); const reps = window.db.representatives || [];
            if(reps.length === 0) { tb.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">الدفتر فارغ حالياً</td></tr>'; return; }
            tb.innerHTML = reps.map(r => `<tr class="hover:bg-slate-800/60"><td class="p-3 font-bold">${r.entity}</td><td class="p-3">${r.name}</td><td class="p-3 font-mono text-emerald-400">${r.phone}</td><td class="p-3 text-center"><button onclick="deleteRep(${r.id})" class="text-rose-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button></td></tr>`).join(''); 
        }
        window.deleteRep = function(id) { if(confirm("حذف الممثل؟")) { window.db.representatives = window.db.representatives.filter(x=>x.id!==id); window.saveDB(); window.renderRepsTable(); } }

        window.handleSaveSchedule = function(e) { e.preventDefault(); if(!window.db.schedules) window.db.schedules = []; window.db.schedules.push({ id: Date.now(), day: document.getElementById('schDay').value, judge: document.getElementById('schJudge').value, sec: document.getElementById('schSec').value }); window.saveDB(); window.renderScheduleTable(); }
        window.renderScheduleTable = function() {
            let mySch = window.db.schedules || [];
            if (window.currentUser.role !== 'مدير إدارة' && window.currentUser.role !== 'مدير نظام') mySch = mySch.filter(s => s.judge === window.currentUser.fullName || s.sec === window.currentUser.fullName);
            const tb = document.getElementById('schTbody');
            if(mySch.length === 0) { tb.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">لا يوجد جداول معتمدة لك</td></tr>'; return; }
            tb.innerHTML = mySch.map(s => `<tr class="hover:bg-slate-800/60"><td class="p-3 font-bold text-amber-400">${s.day}</td><td class="p-3">${s.judge}</td><td class="p-3">${s.sec}</td><td class="p-3 text-center">${(window.currentUser.role === 'مدير إدارة' || window.currentUser.role === 'مدير نظام') ? `<button onclick="deleteSch(${s.id})" class="text-rose-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>` : '<i class="fa-solid fa-lock text-slate-600"></i>'}</td></tr>`).join('');
        }
        window.deleteSch = function(id) { if(confirm("حذف من الجدول؟")) { window.db.schedules = window.db.schedules.filter(x=>x.id!==id); window.saveDB(); window.renderScheduleTable(); } }

        window.openUserModal = function(id=null) {
            document.getElementById('uId').value = id || ''; document.getElementById('uUser').value = id ? window.db.users.find(x=>x.id===id).username : ''; document.getElementById('uUser').disabled = !!id;
            if(id) { const u = window.db.users.find(x=>x.id===id); document.getElementById('uName').value = u.fullName; document.getElementById('uPass').value = u.password; document.getElementById('uRole').value = u.role; } else { document.getElementById('uName').value = ''; document.getElementById('uPass').value = ''; }
            document.getElementById('userModal').classList.remove('hidden');
        }
        window.saveUser = function(e) {
            e.preventDefault(); const id = document.getElementById('uId').value;
            if(id) {
                const u = window.db.users.find(x=>x.id===id); u.fullName = document.getElementById('uName').value; u.password = document.getElementById('uPass').value; u.role = document.getElementById('uRole').value;
            } else { 
                const existing = window.db.users.find(x=>x.username.toLowerCase() === document.getElementById('uUser').value.toLowerCase());
                if(existing) { alert('اسم الدخول مستخدم مسبقاً!'); return; }
                window.db.users.push({id:'usr_'+Date.now(), username:document.getElementById('uUser').value, fullName:document.getElementById('uName').value, password:document.getElementById('uPass').value, role:document.getElementById('uRole').value, email:'', points:0, createdAt:new Date().toISOString()}); 
            }
            window.saveDB(); window.closeModal('userModal'); window.renderUsersTable(); window.populateDropdowns();
        }
        window.deleteUser = function(id) { if(!confirm("هل أنت متأكد من حذف هذا المستخدم نهائياً؟")) return; window.db.users = window.db.users.filter(x => x.id !== id); window.saveDB(); window.renderUsersTable(); window.populateDropdowns(); }
        window.renderUsersTable = function() {
            document.getElementById('usersTbody').innerHTML = window.db.users.map(u => `<tr class="hover:bg-slate-800/60"><td class="p-3 font-mono font-bold">${u.username}</td><td class="p-3">${u.fullName}</td><td class="p-3 text-amber-400 font-bold">${u.role}</td><td class="p-3 font-mono text-emerald-400 font-bold">🏅 ${u.points||0}</td><td class="p-3"><span dir="ltr" class="text-slate-400">${window.formatDateDDMMYYYY(u.createdAt.split('T')[0])}</span></td><td class="p-3 text-center"><button onclick="openUserModal('${u.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-2 py-1 rounded text-xs transition-colors"><i class="fa-solid fa-pen"></i></button> ${window.currentUser.role === 'مدير نظام' && u.username !== 'admin' ? `<button onclick="deleteUser('${u.id}')" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-2 py-1 rounded text-xs mr-1 transition-colors"><i class="fa-solid fa-trash-can"></i></button>` : ''}</td></tr>`).join('');
            document.getElementById('adminMsg2').value = window.db.msg2Template;
        }
        window.saveAdminMsg2 = function() { window.db.msg2Template = document.getElementById('adminMsg2').value; window.saveDB(); alert('تم حفظ القالب بنجاح.'); }

        let c1, c2;
        window.renderDashboard = function() {
            const fDate = document.getElementById('dashFrom').value; const tDate = document.getElementById('dashTo').value; const usr = document.getElementById('dashUser').value;
            let cFilter = window.db.cases || [];
            if(fDate) cFilter = cFilter.filter(c => new Date(c.createdAt || Date.now()) >= new Date(fDate));
            if(tDate) cFilter = cFilter.filter(c => new Date(c.createdAt || Date.now()) <= new Date(tDate + 'T23:59:59'));
            if(usr) cFilter = cFilter.filter(c => c.creator === usr);

            document.getElementById('dashTotalCases').innerText = cFilter.length;
            let tMsg = 0; cFilter.forEach(c => { if(c.notificationsSent) tMsg += usr ? c.notificationsSent.filter(n=>n.sender===usr).length : c.notificationsSent.length; });
            document.getElementById('dashTotalMsgs').innerText = tMsg;
            const mC = cFilter.filter(c => (c.dateStr || '').includes(String(new Date().getMonth()+1).padStart(2,'0')+'/'+new Date().getFullYear())).length;
            document.getElementById('dashMonthCases').innerText = mC;
            document.getElementById('dashTeamPts').innerText = window.db.users.reduce((a,b)=>a+(b.points||0),0);

            if(c1) c1.destroy(); if(c2) c2.destroy();
            c1 = new Chart(document.getElementById('chart1').getContext('2d'), { type:'bar', data: { labels:['إجمالي القضايا','رسائل الإخطارات'], datasets:[{label:'العدد', data:[cFilter.length, tMsg], backgroundColor:['#d4af37','#10b981'], borderRadius: 4}] }, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{labels:{color:'#cbd5e1'}}}, scales:{y:{ticks:{color:'#94a3b8'}, grid:{color:'#334155'}},x:{ticks:{color:'#cbd5e1'}, grid:{display:false}}}} });
            const realUsers = window.db.users.filter(u => u.username !== 'admin');
            c2 = new Chart(document.getElementById('chart2').getContext('2d'), { type:'doughnut', data: { labels:realUsers.map(u=>u.fullName), datasets:[{data:realUsers.map(u=>u.points||0), backgroundColor:['#d4af37','#0ea5e9','#10b981','#f43f5e', '#a855f7', '#f97316'], borderWidth: 0}] }, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{color:'#cbd5e1', font:{family:'Tajawal'}}}}} });
        }
    </script>
</body>
</html>
