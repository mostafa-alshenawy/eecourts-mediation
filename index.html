<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيئة التحضير والوساطة - محكمة القاهرة الاقتصادية</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #c5a059 0%, #dfba73 50%, #9e7d3b 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        img.protected-logo { user-drag: none; -webkit-user-drag: none; user-select: none; pointer-events: none; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-900">

    <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center bg-slate-950 z-50">
        <i class="fa-solid fa-scale-balanced text-amber-500 text-6xl mb-4 animate-bounce"></i>
        <h2 class="text-xl font-bold text-slate-200" id="loadingText">جاري الاتصال الآمن بالمحكمة...</h2>
    </div>

    <div id="app" class="hidden flex-grow flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQW6GgoM1DWENB70MDxPhTMbansoZ3V4s",
            authDomain: "eecourts-mediation.firebaseapp.com",
            databaseURL: "https://eecourts-mediation-default-rtdb.firebaseio.com",
            projectId: "eecourts-mediation",
            storageBucket: "eecourts-mediation.firebasestorage.app",
            messagingSenderId: "506181080532",
            appId: "1:506181080532:web:0acbae1ab09a245d63b241"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        const secondaryApp = initializeApp(firebaseConfig, "Secondary");
        const secondaryAuth = getAuth(secondaryApp);

        let dbRef = null;
        window.activeTab = 'cases';
        window.currentUser = null;
        window.activeWhatsappContext = null;
        window.activeRepTargetField = null;
        window.clientIP = 'جاري التحقق...';
        window.db = null;

        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(d => window.clientIP = d.ip)
            .catch(() => window.clientIP = 'غير معروف');

        const defaultDB = {
            users: [], cases: [], deletedCases: [], representatives: [], schedules: [], activities: [],
            msg1DefendantTemplate: `السيد/ [اسم المدعى عليه] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعي]، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg1ClaimantTemplate: `السيد/ [اسم المدعي] المحترم،\nتهدي إدارةُ الوساطة والتحكيم بمحكمة القاهرة الاقتصادية إلى سيادتكم خالصَ التحية والتقدير،\nنحيطكم علمًا بأنه قد تحدد موعد جلسة للوساطة في النزاع القائم بينكم وبين السيد/ [اسم المدعى عليه]، وذلك يوم [اليوم] الموافق [التاريخ] في تمام الساعة [الساعة]، بهدف بذل مساعي الصلح بين الطرفين.\nأمين السر المختص: [اسم أمين السر]\nنرجو التكرم بالحضور في الموعد المحدد، مع خالص التمنيات بالتوصل إلى تسوية ودية.\nوتفضلوا بقبول فائق الاحترام والتقدير.`,
            msg2Template: `هيئة التحضير والوساطة بالمحاكم الاقتصادية\n*طريقك لحل نزاعك وديًا*\n\nالرجاء الاطلاع على المزايا والإجراءات للوصول لأفضل تسوية تحفظ حقوقك.`
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                dbRef = ref(database, 'ECON_COURT_DB'); 
                onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) window.db = data;
                    else { window.db = defaultDB; set(dbRef, window.db); }

                    if (!window.db.users) window.db.users = [];
                    window.currentUser = window.db.users.find(u => u.email.toLowerCase() === user.email.toLowerCase());
                    
                    if (!window.currentUser && user.email === 'mostafa.elshenawy@gmail.com') {
                        window.currentUser = { id: user.uid, username: 'admin', fullName: 'مدير النظام', role: 'مدير نظام', email: user.email, phone: '01000000000', points: 0, isFirstLogin: false, createdAt: new Date().toISOString() };
                        window.db.users.push(window.currentUser);
                        window.saveDB();
                    } else if (!window.currentUser) {
                        auth.signOut();
                        alert("حسابك غير مسجل في قاعدة بيانات الموظفين.");
                        return;
                    }

                    if (!window.currentUser.sessionLogged) {
                        window.logActivity('تسجيل دخول', `تسجيل دخول ناجح للنظام`);
                        window.currentUser.sessionLogged = true; 
                    }

                    document.getElementById('loadingScreen').classList.add('hidden');
                    
                    if (window.currentUser.isFirstLogin) {
                        document.getElementById('app').innerHTML = window.getHTMLFirstLogin();
                        document.getElementById('app').classList.remove('hidden');
                    } else {
                        if (!document.getElementById('appContainer')) {
                            window.renderMainLayout();
                        }
                        document.getElementById('navUserName').innerText = window.currentUser.fullName;
                        document.getElementById('navUserRole').innerText = window.currentUser.role;
                        window.updateUserPointsDisplay();
                        window.setupPermissions(); 
                        window.switchTab(window.activeTab);
                    }
                });
            } else {
                if (dbRef) off(dbRef);
                window.db = null;
                window.currentUser = null;
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('app').innerHTML = window.getHTMLLogin();
                document.getElementById('app').classList.remove('hidden');
            }
        });

        window.saveDB = function() { if (dbRef && window.db) set(dbRef, window.db); };
        window.getDeviceId = function() { let id = localStorage.getItem('WA_SYS_DEV_ID'); if(!id) { id = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase(); localStorage.setItem('WA_SYS_DEV_ID', id); } return id; }
        
        window.formatDateDDMMYYYY = function(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-'); 
            if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateString;
        }

        window.updateSystemClock = function() {
            const clk = document.getElementById('systemClock');
            if(clk) { clk.innerText = new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date()); }
        };
        setInterval(window.updateSystemClock, 1000);

        window.getCairoDateTimeString = function() { return new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date()); }
        window.formatArabicTime = function(timeString) { if (!timeString) return ''; const [hours, minutes] = timeString.split(':'); let h = parseInt(hours, 10); const ampm = h >= 12 ? 'مساءً' : 'صباحاً'; h = h % 12 || 12; return `${h}:${minutes} ${ampm}`; }
        window.getDayNameFromDate = function(dateString) { if (!dateString) return ''; return new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(new Date(dateString)); }
        window.generateVerificationCode = function() { return 'WAC-' + Date.now().toString().slice(-4) + '-' + Math.random().toString(36).substring(2, 5).toUpperCase(); }

        window.logActivity = function(type, details) {
            if (!window.currentUser || !window.db) return;
            if(!window.db.activities) window.db.activities = [];
            window.db.activities.unshift({ id: 'act_' + Date.now(), timestamp: new Date().toISOString(), cairoTime: window.getCairoDateTimeString(), userId: window.currentUser.id, username: window.currentUser.username, userFullName: window.currentUser.fullName, userRole: window.currentUser.role, type: type, details: details, deviceId: window.getDeviceId(), ip: window.clientIP, isHidden: false, hiddenByUsername: null, hiddenByFullName: null });
            window.saveDB();
        }

        window.addPoint = function(reason) {
            if (!window.currentUser || window.currentUser.role === 'مدير نظام') return; 
            const u = window.db.users.find(x => x.id === window.currentUser.id);
            if (u) { u.points = (u.points || 0) + 1; window.currentUser.points = u.points; window.saveDB(); window.updateUserPointsDisplay(); }
        }

        window.updateUserPointsDisplay = function() {
            const ptsElem = document.getElementById('userPointsBadge');
            if (ptsElem && window.currentUser) {
                if (window.currentUser.role === 'مدير نظام') ptsElem.innerText = `مدير نظام (بدون نقاط)`;
                else ptsElem.innerText = `🏅 النقاط: ${window.currentUser.points || 0}`;
            }
        }

        window.getHTMLLogin = function() {
            return `
                <div id="loginView" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-950 w-full">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#c5a059_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="max-w-md w-full bg-slate-900/90 border border-amber-500/30 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative z-10">
                        <div class="text-center mb-8">
                            <img src="logo.png" alt="شعار المحكمة" class="protected-logo w-24 h-24 mx-auto mb-4 object-contain" oncontextmenu="return false;" draggable="false">
                            <h1 class="text-2xl font-black text-amber-400 mb-1">جمهورية مصر العربية</h1>
                            <h2 class="text-xl font-bold text-slate-100 mb-1">وزارة العدل</h2>
                            <p class="text-amber-500/90 text-sm font-semibold">محكمة القاهرة الاقتصادية</p>
                            <p class="text-xs text-slate-400 mt-1">نظام إدارة هيئة التحضير والوساطة</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div><label class="block text-xs font-medium text-slate-300 mb-1.5">اسم المستخدم (Username) أو الإيميل</label><input type="text" id="loginUsername" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm" dir="ltr"></div>
                            <div><label class="block text-xs font-medium text-slate-300 mb-1.5">كلمة المرور</label><input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 text-sm"></div>
                            <div id="loginError" class="hidden text-rose-500 text-xs font-bold text-center bg-rose-500/10 p-2 rounded border border-rose-500/30"></div>
                            <button type="submit" id="btnLogin" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-lg shadow-lg hover:brightness-110 text-sm transition-all">تسجيل الدخول للنظام</button>
                        </form>
                    </div>
                </div>`;
        }

        window.getHTMLFirstLogin = function() {
            return `
                <div id="firstLoginModal" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-950 w-full">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#c5a059_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="max-w-md w-full bg-slate-900/90 border border-emerald-500/50 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative z-10">
                        <div class="text-center mb-6">
                            <img src="logo.png" alt="الشعار" class="protected-logo w-16 h-16 mx-auto mb-3 object-contain" oncontextmenu="return false;" draggable="false">
                            <h3 class="text-emerald-400 font-bold text-lg mb-1"><i class="fa-solid fa-shield-halved ml-1"></i> إعداد الحساب الإلزامي</h3>
                            <p class="text-slate-300 text-xs leading-relaxed">أهلاً بك في أول تسجيل دخول. كإجراء أمني وحماية لبيانات المنظومة، يرجى تحديث بياناتك وتغيير كلمة المرور الافتراضية.</p>
                        </div>
                        <form onsubmit="handleFirstLoginSetup(event)" class="space-y-4 text-xs">
                            <div><label class="text-slate-400 block mb-1">البريد الإلكتروني المخصص للحساب (ثابت)</label><input type="text" disabled value="${window.currentUser.email}" class="w-full bg-slate-950 border border-slate-800 text-slate-500 rounded p-2.5 text-left outline-none cursor-not-allowed" dir="ltr"></div>
                            <div><label class="text-slate-400 block mb-1">رقم الهاتف الشخصي (للتواصل)</label><input type="tel" id="flPhone" required class="w-full bg-slate-800 border border-slate-700 text-white rounded p-2.5 outline-none focus:border-emerald-500"></div>
                            <div><label class="text-slate-300 block mb-1">كلمة المرور الجديدة (إلزامية، 6 أحرف كحد أدنى)</label><input type="password" id="flPass" required minlength="6" class="w-full bg-slate-800 border border-slate-700 text-white rounded p-2.5 outline-none focus:border-emerald-500" placeholder="أدخل كلمة مرور قوية..."></div>
                            <div id="flError" class="hidden text-rose-500 text-xs font-bold text-center bg-rose-500/10 p-2 rounded border border-rose-500/30"></div>
                            <button type="submit" id="btnFL" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg transition-all mt-4">حفظ البيانات ودخول النظام</button>
                        </form>
                    </div>
                </div>`;
        }

        window.renderMainLayout = function() {
            document.getElementById('app').innerHTML = `
                <div id="appContainer" class="flex-grow flex flex-col w-full">
                    <header class="bg-slate-950 border-b border-amber-500/20 px-6 py-3 no-print sticky top-0 z-50 shadow-lg relative">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">
                            <div class="w-1/3 flex items-center gap-3">
                                <img src="logo.png" alt="الشعار" class="protected-logo w-10 h-10 object-contain" oncontextmenu="return false;" draggable="false">
                                <div>
                                    <h1 class="text-base font-bold text-amber-400 leading-tight">محكمة القاهرة الاقتصادية</h1>
                                    <p class="text-xs text-slate-400 mb-0.5">هيئة التحضير والوساطة</p>
                                </div>
                            </div>
                            <div class="w-1/3 flex justify-center text-center">
                                <div class="bg-slate-900 border border-slate-800 px-5 py-2 rounded-full shadow-inner flex items-center gap-2">
                                    <i class="fa-regular fa-clock text-amber-500"></i>
                                    <span class="text-xs text-emerald-400 font-bold tracking-wide" id="systemClock"></span>
                                </div>
                            </div>
                            <div class="w-1/3 flex items-center justify-end gap-3">
                                <button onclick="openLeaderboard()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded shadow flex items-center gap-1 transition-all"><i class="fa-solid fa-ranking-star"></i> <span class="hidden sm:inline">لوحة الشرف</span></button>
                                <div id="userPointsBadge" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-xs px-3 py-1.5 rounded shadow"></div>
                                <div class="text-right hidden md:block"><p class="text-xs font-bold text-slate-200" id="navUserName"></p><span class="inline-block bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded" id="navUserRole"></span></div>
                                <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-amber-600/30 text-slate-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors" title="الملف الشخصي"><i class="fa-solid fa-user-gear"></i></button>
                                <button onclick="logout()" class="bg-slate-800 hover:bg-rose-900/50 text-slate-300 hover:text-rose-300 border border-slate-700 p-2 rounded-lg text-xs transition-colors" title="خروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                            </div>
                        </div>
                    </header>

                    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-2 shadow-md no-print">
                        <div class="max-w-7xl mx-auto flex flex-wrap gap-2 text-xs font-bold">
                            <button id="tab-cases" onclick="switchTab('cases')" class="tab-btn px-4 py-2 rounded-lg bg-amber-600 text-white transition-colors"><i class="fa-solid fa-folder-open ml-1"></i> القضايا والرسائل</button>
                            <button id="tab-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-chart-line ml-1"></i> الداش بورد</button>
                            <button id="tab-representatives" onclick="switchTab('representatives')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-building-columns ml-1"></i> الممثلون</button>
                            <button id="tab-schedule" onclick="switchTab('schedule')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 transition-colors"><i class="fa-solid fa-calendar-days ml-1"></i> جدول العمل</button>
                            <button id="tab-activity" onclick="switchTab('activity')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-shield-halved ml-1"></i> سجل النشاط</button>
                            <button id="tab-users" onclick="switchTab('users')" class="tab-btn px-4 py-2 rounded-lg text-slate-300 hidden transition-colors"><i class="fa-solid fa-users-gear ml-1"></i> إدارة النظام</button>
                            <button id="tab-deleted" onclick="switchTab('deleted')" class="tab-btn px-4 py-2 rounded-lg text-rose-400 hidden transition-colors"><i class="fa-solid fa-trash-can ml-1"></i> الأرشيف المحذوف</button>
                        </div>
                    </nav>

                    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
                        <section id="view-cases"></section>
                        <section id="view-dashboard" class="hidden"></section>
                        <section id="view-representatives" class="hidden"></section>
                        <section id="view-schedule" class="hidden"></section>
                        <section id="view-activity" class="hidden"></section>
                        <section id="view-users" class="hidden"></section>
                        <section id="view-deleted" class="hidden"></section>
                    </main>

                    <footer class="mt-auto bg-slate-950 border-t border-amber-500/20 py-4 text-center no-print">
                        <p class="text-sm gold-text font-bold tracking-wider">جميع الحقوق محفوظة لإدارة التحضير والوساطة بمحكمة القاهرة الاقتصادية &copy; ${new Date().getFullYear()}</p>
                    </footer>
                </div>
                <div id="modalsContainer"></div>
            `;
            window.buildSectionHTML();
            window.buildModalsHTML();
            window.updateSystemClock();
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin'); btn.disabled = true; btn.innerText = 'جاري المصادقة...';
            const rawInput = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');
            
            let email = rawInput;
            if (rawInput.toLowerCase() === 'admin') {
                email = 'mostafa.elshenawy@gmail.com';
            } else if (!rawInput.includes('@')) {
                email = rawInput + '@eecourts.gov.eg';
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                err.innerText = 'بيانات الدخول غير صحيحة أو الحساب غير موجود!';
                err.classList.remove('hidden');
                btn.disabled = false; btn.innerText = 'تسجيل الدخول للنظام';
            }
        }

        window.handleFirstLoginSetup = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnFL'); btn.disabled = true; btn.innerText = 'جاري التحديث...';
            const err = document.getElementById('flError'); err.classList.add('hidden');
            const newPass = document.getElementById('flPass').value;
            const phone = document.getElementById('flPhone').value.trim();
            
            try {
                await updatePassword(auth.currentUser, newPass);
                const u = window.db.users.find(x => x.id === window.currentUser.id);
                u.phone = phone;
                u.isFirstLogin = false;
                window.currentUser = u;
                window.saveDB();
                window.logActivity('تحديث أمني', 'تم استكمال البيانات الإلزامية وتغيير كلمة المرور الافتراضية');
                
                document.getElementById('app').innerHTML = ''; 
                window.renderMainLayout();
                document.getElementById('navUserName').innerText = window.currentUser.fullName;
                document.getElementById('navUserRole').innerText = window.currentUser.role;
                window.updateUserPointsDisplay();
                window.setupPermissions(); 
                window.switchTab('cases');
            } catch (error) {
                err.innerText = 'حدث خطأ أثناء تغيير كلمة المرور: ' + error.message;
                err.classList.remove('hidden');
                btn.disabled = false; btn.innerText = 'حفظ البيانات ودخول النظام';
            }
        }

        window.logout = async function() {

            const activeBtn = document.getElementById('tab-' + tabName);

            if (tabName === 'representatives') window.renderRepsTable();
            if (tabName === 'schedule') window.renderScheduleTable();

        window.handleSaveCase = function(e) {

            const newCase = {
                id: 'case_' + Date.now(), caseNum: document.getElementById('caseNum').value + '/' + document.getElementById('caseYear').value,
                claimant: document.getElementById('claimantName').value, claimantPhone: document.getElementById('claimantPhone').value,
                defendant: document.getElementById('defendantName').value, defendantPhone: document.getElementById('defendantPhone').value,
                dateStr: window.formatDateDDMMYYYY(sessionDate), dayStr: window.getDayNameFromDate(sessionDate), timeStr: window.formatArabicTime(document.getElementById('sessionTime').value),

        window.deleteCase = function(id) {
            if(!confirm('تحذير مدير النظام: هل أنت متأكد من حذف هذه الدعوى؟\nسيتم نقل الدعوى للأرشيف السري، وخصم نقطة الإدخال ونقاط الرسائل المُرسلة منها.')) return;
            const cIndex = window.db.cases.findIndex(c => c.id === id);
            if(cIndex > -1) {
                const caseData = window.db.cases[cIndex];
                const u = window.db.users.find(usr => usr.fullName === caseData.creator);
                if(u && u.points > 0 && u.role !== 'مدير نظام') u.points--;
                if (caseData.notificationsSent && caseData.notificationsSent.length > 0) {
                    caseData.notificationsSent.forEach(notification => {
                        const senderUser = window.db.users.find(usr => usr.fullName === notification.sender);
                        if (senderUser && senderUser.points > 0 && senderUser.role !== 'مدير نظام') senderUser.points--;
                    });
                }
                if(!window.db.deletedCases) window.db.deletedCases = [];
                caseData.deletedAt = window.getCairoDateTimeString(); caseData.deletedBy = window.currentUser.fullName;
                window.db.deletedCases.unshift(caseData);
                window.db.cases.splice(cIndex, 1);
                window.logActivity('حذف دعوى (صلاحية مدير)', `حذف الدعوى ${caseData.caseNum} وخصم النقاط المرتبطة بها`);
                window.saveDB(); window.renderCasesTable();
            }
        }

                    <td class="p-3 text-[11px] text-slate-400">${c.creator}</td>
                    <td class="p-3 text-[10px]">${(c.notificationsSent && c.notificationsSent.length) ? c.notificationsSent.map(n => `<div class="bg-slate-950 border border-slate-800 p-1.5 mb-1 rounded"><span class="text-emerald-400">✓ ${n.type} لـ ${n.target === 'def' ? 'المدعى عليه' : 'المدعي'}</span><br><span class="text-amber-500 font-mono">كود: ${n.verificationCode}</span><br><span class="text-slate-500">بواسطة: ${n.sender}</span></div>`).join('') : '<span class="text-slate-600">لم تُرسل إخطارات</span>'}</td>
                    <td class="p-3 text-center flex flex-col gap-1.5">
                        <button onclick="prepWA('${c.id}', 'def')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-2 py-1.5 rounded transition-colors shadow"><i class="fa-brands fa-whatsapp ml-1"></i>للمدعى عليه</button>
                        <button onclick="prepWA('${c.id}', 'claim')" class="bg-teal-600 hover:bg-teal-500 text-white text-[10px] px-2 py-1.5 rounded transition-colors shadow"><i class="fa-brands fa-whatsapp ml-1"></i>للمدعي</button>
                        ${window.currentUser.role === 'مدير نظام' ? `<button onclick="deleteCase('${c.id}')" class="bg-rose-900/50 hover:bg-rose-700 text-rose-300 hover:text-white border border-rose-800 text-[10px] px-2 py-1.5 rounded transition-colors shadow mt-1"><i class="fa-solid fa-trash-can ml-1"></i>حذف كمدير</button>` : ''}
                    </td>
                </tr>`).join('');
        }

        window.exportData = function(type) {
            if(type === 'excel') {
                let csv = '\ufeffرقم الدعوى,المدعي,هاتف المدعي,المدعى عليه,هاتف المدعى عليه,أمين السر,تاريخ الجلسة,وقت الجلسة,مدخل البيانات\n';
                (window.db.cases||[]).forEach(c => { csv += `${c.caseNum},${c.claimant},${c.claimantPhone},${c.defendant},${c.defendantPhone},${c.secretaryName},${c.dateStr},${c.timeStr},${c.creator}\n`; });
                let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
                let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'سجل_قضايا_الوساطة.csv'; a.click();
            } else if(type === 'word') {
                let html = "<html dir='rtl'><head><meta charset='utf-8'></head><body style='font-family:Arial,sans-serif;'><h2 style='text-align:center;'>سجل القضايا المجدولة - إدارة التحضير والوساطة</h2><br><table border='1' cellpadding='5' style='border-collapse:collapse;width:100%;text-align:right;'><tr><th>رقم الدعوى</th><th>المدعي</th><th>المدعى عليه</th><th>أمين السر</th><th>تاريخ الجلسة</th></tr>";
                (window.db.cases||[]).forEach(c => { html += `<tr><td>${c.caseNum}</td><td>${c.claimant}</td><td>${c.defendant}</td><td>${c.secretaryName}</td><td>${c.dateStr}</td></tr>`; });
                html += "</table><br><p style='text-align:center;font-size:12px;'>جميع حقوق الملكية الفكرية محفوظة لهيئة التحضير والوساطة بمحكمة القاهرة الاقتصادية</p></body></html>";
                let blob = new Blob(['\ufeff', html], {type: 'application/msword'});
                let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'تقرير_قضايا_الوساطة.doc'; a.click();
            }
            window.logActivity('تصدير بيانات', `قام مدير النظام بتصدير بيانات القضايا بصيغة ${type}`);

        window.prepWA = function(caseId, target) {
            window.activeWhatsappContext = { caseId, target };
            const c = window.db.cases.find(x => x.id === caseId); const isDef = target === 'def';
            document.getElementById('waTitle').innerHTML = `<i class="fa-brands fa-whatsapp ml-1 text-emerald-400"></i> إرسال إلى ${isDef ? 'المدعى عليه' : 'المدعي'} (${c.caseNum})`;
            let msg1 = (isDef ? window.db.msg1DefendantTemplate : window.db.msg1ClaimantTemplate).replace('[اسم المدعى عليه]', c.defendant).replace('[اسم المدعي]', c.claimant).replace('[اليوم]', c.dayStr).replace('[التاريخ]', c.dateStr).replace('[الساعة]', c.timeStr).replace('[اسم أمين السر]', c.secretaryName || 'غير محدد');
            document.getElementById('waMsg1').value = msg1 + "\n\nموقع المحكمة: https://maps.app.goo.gl/Bp8cKHfzuBj5fniy7";
            document.getElementById('waMsg2').value = window.db.msg2Template;
            document.getElementById('waModal').classList.remove('hidden');
        }

        window.executeSendWA = function(msgNum) {
            const c = window.db.cases.find(x => x.id === window.activeWhatsappContext.caseId);
            const phone = window.activeWhatsappContext.target === 'def' ? c.defendantPhone : c.claimantPhone;
            let cleanPhone = phone.replace(/[^0-9]/g, ''); if (cleanPhone.startsWith('01')) cleanPhone = '2' + cleanPhone;
            const vCode = window.generateVerificationCode();
            let text = document.getElementById(msgNum === 1 ? 'waMsg1' : 'waMsg2').value;
            text += `\n\n=== توثيق المحكمة ===\nكود التوثيق المرجعي: ${vCode}`;
            if(!c.notificationsSent) c.notificationsSent = [];
            c.notificationsSent.push({ type: msgNum === 1 ? 'رسالة أولى' : 'توعوية', target: window.activeWhatsappContext.target, sender: window.currentUser.fullName, verificationCode: vCode, date: new Date().toISOString() });
            window.addPoint('إرسال واتساب'); window.logActivity('إرسال واتساب', `توليد كود (${vCode}) لرقم ${cleanPhone}`);
            window.renderCasesTable(); window.closeModal('waModal');
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
        }

            tb.innerHTML = aFilter.map(a => {

                let trClass = 'hover:bg-slate-800/60 transition-colors'; if(a.type === 'محاولة دخول غير مشروعة') trClass = 'bg-rose-950/40 border-l-4 border-rose-500'; if(a.isHidden) trClass = 'opacity-50 line-through bg-rose-950/20';

        window.toggleAct = function(id, hide) { const a = window.db.activities.find(x => x.id === id); a.isHidden = hide; a.hiddenByUsername = hide ? window.currentUser.username : null; a.hiddenByFullName = hide ? window.currentUser.fullName : null; window.saveDB(); window.renderActivityTable(); }

        window.renderRepsTable = function() { 
            const tb = document.getElementById('repsTbody'); const reps = window.db.representatives || [];
            if(reps.length === 0) { tb.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">الدفتر فارغ حالياً</td></tr>'; return; }
            tb.innerHTML = reps.map(r => `<tr class="hover:bg-slate-800/60"><td class="p-3 font-bold">${r.entity}</td><td class="p-3">${r.name}</td><td class="p-3 font-mono text-emerald-400">${r.phone}</td><td class="p-3 text-center"><button onclick="deleteRep(${r.id})" class="text-rose-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button></td></tr>`).join(''); 
        }
        window.deleteRep = function(id) { if(confirm("حذف الممثل؟")) { window.db.representatives = window.db.representatives.filter(x=>x.id!==id); window.saveDB(); window.renderRepsTable(); } }

        window.handleSaveSchedule = function(e) { e.preventDefault(); if(!window.db.schedules) window.db.schedules = []; window.db.schedules.push({ id: Date.now(), day: document.getElementById('schDay').value, judge: document.getElementById('schJudge').value, sec: document.getElementById('schSec').value }); window.saveDB(); window.renderScheduleTable(); }
        window.renderScheduleTable = function() {
            let mySch = window.db.schedules || [];
            if (window.currentUser.role !== 'مدير إدارة' && window.currentUser.role !== 'مدير نظام') mySch = mySch.filter(s => s.judge === window.currentUser.fullName || s.sec === window.currentUser.fullName);
            const tb = document.getElementById('schTbody');
            if(mySch.length === 0) { tb.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">لا يوجد جداول معتمدة لك</td></tr>'; return; }
            tb.innerHTML = mySch.map(s => `<tr class="hover:bg-slate-800/60"><td class="p-3 font-bold text-amber-400">${s.day}</td><td class="p-3">${s.judge}</td><td class="p-3">${s.sec}</td><td class="p-3 text-center">${(window.currentUser.role === 'مدير إدارة' || window.currentUser.role === 'مدير نظام') ? `<button onclick="deleteSch(${s.id})" class="text-rose-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>` : '<i class="fa-solid fa-lock text-slate-600"></i>'}</td></tr>`).join('');
        }
        window.deleteSch = function(id) { if(confirm("حذف من الجدول؟")) { window.db.schedules = window.db.schedules.filter(x=>x.id!==id); window.saveDB(); window.renderScheduleTable(); } }

        window.openUserModal = function() {
            document.getElementById('uUser').value = ''; document.getElementById('uName').value = ''; document.getElementById('uPass').value = ''; 
            document.getElementById('uError').classList.add('hidden');
            document.getElementById('userModal').classList.remove('hidden');
        }
        
        window.saveUser = async function(e) {
            e.preventDefault(); 
            const btn = document.getElementById('btnCreateUser'); btn.disabled = true; btn.innerText = 'جاري الاتصال بجوجل...';
            const err = document.getElementById('uError'); err.classList.add('hidden');
            
            const rawUser = document.getElementById('uUser').value.trim();
            let email = rawUser;
            if (!rawUser.includes('@')) {
                email = rawUser + '@eecourts.gov.eg';
            }
            const pass = document.getElementById('uPass').value;
            const name = document.getElementById('uName').value;
            const role = document.getElementById('uRole').value;

            const existing = window.db.users.find(x => x.email.toLowerCase() === email.toLowerCase());
            if(existing) { 
                err.innerText = 'اسم الدخول (الإيميل) مستخدم مسبقاً!'; err.classList.remove('hidden'); 
                btn.disabled = false; btn.innerText = 'تسجيل وإرسال للخادم'; return; 
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
                const newUid = userCredential.user.uid;
                await signOut(secondaryAuth);
                
                window.db.users.push({id: newUid, username: rawUser, fullName: name, role: role, email: email, phone: '', points: 0, isFirstLogin: true, createdAt: new Date().toISOString()}); 
                window.saveDB(); 
                window.logActivity('إدارة الحسابات', `تم إنشاء حساب جديد للموظف ${name}`);
                window.closeModal('userModal'); window.renderUsersTable(); window.populateDropdowns();
                btn.disabled = false; btn.innerText = 'تسجيل وإرسال للخادم';
            } catch (error) {
                err.innerText = 'خطأ من السيرفر: ' + error.message; err.classList.remove('hidden');
                btn.disabled = false; btn.innerText = 'تسجيل وإرسال للخادم';
            }
        }
        
        window.deleteUser = function(id) {
            if(!confirm('تأكيد الحذف: هل أنت متأكد من حذف هذا المستخدم نهائياً؟\n(لن يتمكن من تسجيل الدخول للنظام بعد الآن)')) return;
            window.db.users = window.db.users.filter(u => u.id !== id);
            window.logActivity('إدارة الحسابات', `تم حذف حساب موظف من النظام`);
            window.saveDB(); 
            window.renderUsersTable();
        }

        window.renderUsersTable = function() {
            document.getElementById('usersTbody').innerHTML = window.db.users.map(u => `
                <tr class="hover:bg-slate-800/60">
                    <td class="p-3 font-mono font-bold">${u.email}</td>
                    <td class="p-3">${u.fullName}</td>
                    <td class="p-3 text-amber-400 font-bold">${u.role}</td>
                    <td class="p-3 font-mono text-emerald-400 font-bold">🏅 ${u.points||0}</td>
                    <td class="p-3 text-center flex justify-center items-center h-full">
                        ${u.email.toLowerCase() === 'mostafa.elshenawy@gmail.com' ? 
                          `<span class="bg-emerald-900/40 text-emerald-400 px-2 py-1 rounded text-[10px]"><i class="fa-solid fa-shield ml-1"></i> مدير أساسي</span>` : 
                          `<button onclick="deleteUser('${u.id}')" class="bg-rose-900/50 hover:bg-rose-700 text-rose-300 hover:text-white px-3 py-1.5 rounded text-[10px] transition-colors"><i class="fa-solid fa-trash-can ml-1"></i> حذف</button>`
                        }
                    </td>
                </tr>`).join('');
            document.getElementById('adminMsg2').value = window.db.msg2Template;
        }
        
        window.saveAdminMsg2 = function() { window.db.msg2Template = document.getElementById('adminMsg2').value; window.saveDB(); alert('تم حفظ القالب بنجاح.'); }

        let c1, c2;
        window.renderDashboard = function() {
            const fDate = document.getElementById('dashFrom').value; const tDate = document.getElementById('dashTo').value; const usr = document.getElementById('dashUser').value;
            let cFilter = window.db.cases || [];
            if(fDate) cFilter = cFilter.filter(c => { const parts=c.dateStr.split('/'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`) >= new Date(fDate); });
            if(tDate) cFilter = cFilter.filter(c => { const parts=c.dateStr.split('/'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`) <= new Date(tDate + 'T23:59:59'); });
            if(usr) cFilter = cFilter.filter(c => c.creator === usr);

            document.getElementById('dashTotalCases').innerText = cFilter.length;
            let tMsg = 0; cFilter.forEach(c => { if(c.notificationsSent) tMsg += usr ? c.notificationsSent.filter(n=>n.sender===usr).length : c.notificationsSent.length; });
            document.getElementById('dashTotalMsgs').innerText = tMsg;
            const mC = cFilter.filter(c => (c.dateStr || '').includes(String(new Date().getMonth()+1).padStart(2,'0')+'/'+new Date().getFullYear())).length;
            document.getElementById('dashMonthCases').innerText = mC;
            document.getElementById('dashTeamPts').innerText = window.db.users.filter(u => u.username !== 'admin' && u.email !== 'mostafa.elshenawy@gmail.com').reduce((a,b)=>a+(b.points||0),0);

            if(c1) c1.destroy(); if(c2) c2.destroy();
            c1 = new Chart(document.getElementById('chart1').getContext('2d'), { type:'bar', data: { labels:['إجمالي القضايا','رسائل الإخطارات'], datasets:[{label:'العدد', data:[cFilter.length, tMsg], backgroundColor:['#d4af37','#10b981'], borderRadius: 4}] }, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{labels:{color:'#cbd5e1'}}}, scales:{y:{ticks:{color:'#94a3b8'}, grid:{color:'#334155'}},x:{ticks:{color:'#cbd5e1'}, grid:{display:false}}}} });
            const realUsers = window.db.users.filter(u => u.username !== 'admin' && u.email !== 'mostafa.elshenawy@gmail.com');
            c2 = new Chart(document.getElementById('chart2').getContext('2d'), { type:'doughnut', data: { labels:realUsers.map(u=>u.fullName), datasets:[{data:realUsers.map(u=>u.points||0), backgroundColor:['#d4af37','#0ea5e9','#10b981','#f43f5e', '#a855f7', '#f97316'], borderWidth: 0}] }, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{color:'#cbd5e1', font:{family:'Tajawal'}}}}} });
        }
    </script>
</body>
</html>
